apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: wf-suspend
  namespace: trace-r2
  annotations:
    app.oam.dev/traceID: trace-r2-suspend-fixed
spec:
  components:
    - name: held
      type: webservice
      properties:
        image: nginx:1.21
  workflow:
    steps:
      - name: hold
        type: suspend
        properties:
          duration: 5s
      - name: continue
        type: apply-component
        properties:
          component: held
