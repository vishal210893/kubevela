# =============================================================================
# Auth matrix #5 — wrong credentials (NEGATIVE)
#
# Verifies that supplying invalid credentials produces a clear, attributable
# error from the OCI registry (401 unauthorized / authentication required)
# rather than a misleading downstream error like "gzip: invalid header" or a
# generic "failed to fetch chart" with no auth context.
#
# The Secret references a real username but a deliberately bogus PAT. The
# registry-1.docker.io endpoint will reject the credentials at the token
# exchange and helm/ORAS should bubble up an "unauthorized" error.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
---
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-creds-wrong
  namespace: arc-system
type: kubernetes.io/basic-auth
stringData:
  username: vishal210893
  password: dckr_pat_THIS_IS_DELIBERATELY_INVALID_xxxxxxxxxxxxxxxxxxxxx
---
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: oci-auth-wrong-creds
  namespace: arc-system
spec:
  components:
    - name: arc-crds
      type: helmchart
      properties:
        chart:
          source: oci://registry-1.docker.io/vishal210893/arc-crds
          version: "0.1.0"
          auth:
            secretRef:
              name: dockerhub-creds-wrong
        release:
          name: arc-crds-wrong-creds
          namespace: arc-system
        options:
          createNamespace: true
          includeCRDs: true
          skipTests: true
