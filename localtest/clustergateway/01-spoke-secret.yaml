# Kubeconfig Secret referenced by SpokeCluster/spoke.
#
# The endpoint must be reachable from the cluster-gateway pod, not from the host:
# probe and discovery both proxy hub -> cluster-gateway -> spoke. Hence the docker
# DNS name, which requires the spoke on the hub's network:
#
#   docker network connect k3d-kubevela k3d-spoke-serverlb
#
# Throwaway k3d credentials. Do not commit.
apiVersion: v1
kind: Secret
metadata:
  name: spoke-kubeconfig
  namespace: vela-system
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    clusters:
    - cluster:
        certificate-authority-data: 
        server: https://0.0.0.0:59907
      name: k3d-spoke
    contexts:
    - context:
        cluster: k3d-spoke
        user: admin@k3d-spoke
      name: k3d-spoke
    current-context: k3d-spoke
    kind: Config
    preferences: {}
    users:
    - name: admin@k3d-spoke
      user:
        client-certificate-data: 
        client-key-data: 
