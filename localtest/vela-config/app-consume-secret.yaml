apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: config-consumer
  namespace: default
spec:
  components:
    - name: web
      type: webservice
      properties:
        image: nginx:1.25-alpine
        ports:
          - port: 80
            expose: true
        # demo-registry is the Secret rendered by the demo-image-registry
        # config template. The config is just a Secret, so any workload that
        # accepts a secret reference can consume it.
        imagePullSecrets:
          - demo-registry
