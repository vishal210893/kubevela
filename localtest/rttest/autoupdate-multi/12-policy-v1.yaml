apiVersion: core.oam.dev/v1beta1
kind: PolicyDefinition
metadata:
  name: mk-policy
  namespace: vela-system
spec:
  schematic:
    cue:
      template: |
        // Marker policy. Renders a tiny ConfigMap whose data.policyMarker
        // changes between v1 and v2 so we can observe whether autoUpdate
        // re-rolls the AppRev when only the PolicyDefinition is mutated.
        output: {
          apiVersion: "v1"
          kind:       "ConfigMap"
          metadata: name: "mk-policy-marker"
          data: {
            policyMarker: "v1"
            enabled:      "\(parameter.enabled)"
          }
        }
        parameter: {
          enabled: *true | bool
        }
