apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: multi-app
  namespace: default
  annotations:
    app.oam.dev/autoUpdate: "true"
spec:
  components:
    - name: mk-comp
      type: mk-cd
      properties:
        name: multi-cm
        payload: "hello"
      traits:
        - type: mk-trait
          properties:
            enabled: true
  policies:
    - name: mk-pol
      type: mk-policy
      properties:
        enabled: true
  workflow:
    steps:
      - name: apply-mk-comp
        type: apply-component
        properties:
          component: mk-comp
      - name: marker
        type: mk-step
        properties:
          message: "ping"
