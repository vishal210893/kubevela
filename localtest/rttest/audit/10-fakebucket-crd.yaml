apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fakebuckets.audit.example.com
spec:
  group: audit.example.com
  scope: Namespaced
  names:
    kind: FakeBucket
    plural: fakebuckets
    singular: fakebucket
    shortNames: ["fb"]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                bucketName:
                  type: string
                region:
                  type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                arn:
                  type: string
