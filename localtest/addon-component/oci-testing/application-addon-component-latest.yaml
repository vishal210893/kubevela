# The same addon component resolving the latest version instead of a pin.
#
# An empty version makes the OCI backend list the repository's semver tags and
# take the highest, rather than relying on a floating "latest" tag, which
# `helm push` does not create. Push a second version before using this to see
# the selection actually happen:
#
#   sed -i 's/^version: 1.0.1/version: 1.1.0/' $SCRATCH/addon-src/example/metadata.yaml
#   $SCRATCH/vela addon push $SCRATCH/addon-src/example oci://$(cat $SCRATCH/zot-ip.txt):5000/addons
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: oci-addon-latest
  namespace: vela-system
spec:
  components:
    - name: example
      type: addon
      properties:
        addon: example
        registry: zot-oci
        properties:
          example: hello-oci-latest
        skipVersionValidation: true
