$schema: "http://json-schema.org/draft-07/schema#"
$id: harness-yaml-schema-v1
title: .harness.yaml
description: "Configuration file for the AI-assisted PR pipeline: risk classification, code review, and pre-review brief."
type: object
required: [version, review]
additionalProperties: false

properties:
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "Schema version in semver format (e.g. 1.0.0)."
  specs_repo:
    type: string
    description: "Specs repository in owner/name format (e.g. gwre-pdo/specs). Read by CI setup for memory workflows."
  specs_project:
    type: string
    description: "Specs project directory name (e.g. dev). Read by CI setup for memory workflows."
  assess-risk:
    type: object
    description: "Risk-classification config (preferred, nested shape). Tiers nested under assess-risk.categories take precedence over top-level low/medium/high/critical when both are present."
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: "Whether risk assessment is enabled (advisory; readers may ignore)."
      categories:
        type: object
        description: "Per-tier risk classification config. Keys: low, medium, high, critical."
        additionalProperties: false
        properties:
          low:
            $ref: "#/definitions/tier"
          medium:
            $ref: "#/definitions/tier"
          high:
            $ref: "#/definitions/tier"
          critical:
            $ref: "#/definitions/tier"
  low:
    $ref: "#/definitions/tier"
  medium:
    $ref: "#/definitions/tier"
  high:
    $ref: "#/definitions/tier"
  critical:
    $ref: "#/definitions/tier"
  scripts:
    type: array
    description: "PEP 723 risk scripts. Each prints a tier string (low/medium/high/critical) or nothing to abstain."
    items:
      type: string
  review:
    type: object
    description: "Code review configuration (prompt, per-tier models, optional backwards-compat block)."
    required: [prompt, models]
    additionalProperties: false
    properties:
      prompt:
        type: string
        description: "Review instructions sent to the Claude action by harness-code-review.yaml."
      models:
        $ref: "#/definitions/tier-models"
      backwards_compat:
        type: object
        description: "Optional backwards-compatibility analysis block appended to the review."
        required: [enabled, prompt]
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            description: "Whether to run the backwards-compatibility analysis."
          prompt:
            type: string
            description: "Prompt appended to the review instructions."
  pre_review:
    type: object
    description: "Pre-review brief configuration. Dispatches the pr-pre-reviewer agent to post an anchored comment on the PR."
    required: [enabled, models, prompt]
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: "Whether to dispatch the pre-review agent."
      models:
        $ref: "#/definitions/tier-models"
      prompt:
        type: string
        description: "Instructions for dispatching the pr-pre-reviewer agent."

definitions:
  threshold-value:
    description: "Integer threshold or \"*\" for unlimited."
    oneOf:
      - type: integer
        minimum: 0
      - type: string
        const: "*"
  tier:
    description: "Risk tier configuration with patterns and optional thresholds."
    oneOf:
      - type: array
        description: "Shorthand: list of gitignore-style glob patterns (no thresholds)."
        items:
          type: string
      - type: object
        required: [patterns]
        additionalProperties: false
        properties:
          patterns:
            type: array
            description: "Gitignore-style glob patterns for this tier."
            items:
              type: string
          max-lines:
            $ref: "#/definitions/threshold-value"
          max-files:
            $ref: "#/definitions/threshold-value"
          critical_files_must_match:
            type: boolean
            description: "If true, every changed file must match a pattern in this tier for the tier to apply."
  model-string:
    description: "Claude model identifier (e.g. claude-opus-4-7) or the literal \"skip\" to disable review for this tier."
    type: string
    minLength: 1
  tier-models:
    type: object
    description: "Mapping of risk tier to model identifier. Each value is a model string or \"skip\"."
    required: [critical, high, medium, low]
    additionalProperties: false
    properties:
      critical:
        $ref: "#/definitions/model-string"
      high:
        $ref: "#/definitions/model-string"
      medium:
        $ref: "#/definitions/model-string"
      low:
        $ref: "#/definitions/model-string"
