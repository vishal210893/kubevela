      `mcp-gw-confluence` to move the bounded core Confluence write tools
      (update page / section, create page, add inline comment) and the
      bounded `advanced_write` dispatcher into `permissions.ask`, so each of
      those mutations prompts for confirmation.

      How it works: the base `mcp-gw-confluence` capability puts these core
      writes in `permissions.allow`. This sibling adds the same tools to
      `permissions.ask`. Claude Code precedence is deny > ask > allow, so the
      `ask` entries win and the net effect is a per-write confirmation prompt.

      Note on the dispatchers: `advanced_write` IS re-gated here -- since the
      advanced_dangerous split it only reaches bounded writes, so the base
      allows it and this sibling restores the prompt, same as the named core
      writes. `advanced_read` is NOT listed (read-only dispatch; reads are
      never gated, matching every other read tool). `advanced_dangerous` is
      NOT listed either -- the base keeps it in `ask` unconditionally
      (deletes and removals), so it prompts for everyone regardless of this
      sibling.

      When to use: this is the recommended default for teams NEWLY adopting
      `mcp-gw-confluence`, so a fresh adopter is not surprised by un-prompted
      Confluence writes. Teams past that point (e.g. the `app-plat.ispl`
      profile) compose `mcp-gw-confluence` WITHOUT this sibling.

      Why a separate capability instead of an opt-out flag: settings merge
      (and profile inheritance) is append-only -- a downstream profile cannot
      subtract an `ask` entry that a parent or capability added. So
      write-gating is modeled as a mixin you opt INTO, not opt out of.

      IMPORTANT: compose this at the LEAF profile level (in each adopting
      profile's `capabilities:` list), never in a shared parent profile --
      otherwise profiles that extend the parent inherit the gate and cannot
      drop it.

      Settings-only: no MCP server and no files. `mcp-gw-confluence` provides
      the server; this contributes permission rules only.
