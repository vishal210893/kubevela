  - name: gradle-cache
    summary: Mount Docker volume at ~/.gradle to persist the Gradle cache across containers
    description: |-
      The gradle-cache capability mounts a named Docker volume at /home/node/.gradle so
      that the Gradle user home -- including the wrapper distributions, dependency cache,
      and build caches -- persists across container rebuilds and is shared by every
      container that includes this capability. Cold builds that would otherwise
      re-download Gradle and every dependency from Artifactory complete in a fraction
      of the time once the volume has been warmed.

      A Docker volume is used rather than a bind mount to ~/.gradle on the host, because
      bind-mounting the host's Gradle home risks cross-contamination between host and
      container builds: differing Gradle versions, JVM toolchains, or file ownership
      semantics can corrupt the lock files and dependency cache that Gradle assumes are
      written by a single consistent client. Keeping the cache inside a Docker volume
      isolates the container's Gradle state from any Gradle install the host may use
      while still preserving it across rebuilds.

      The mount is declared with volume-nocopy: true. Combined with mount-bind's
      ensure-mounts initialize script, this ensures the volume starts empty and is
      chowned to the container user (uid 1000) before the container starts, so Gradle
      can write to the cache on first use without permission errors. mount-bind is
      declared as a prereq so this capability cannot be installed in a profile that
      lacks the ownership-init machinery.

      To customize the volume name, set DEVCONTAINER_GRADLE_VOLUME on your host before
      installing a profile that includes this capability. The default volume name is
      devcontainer-gradle, matching the devcontainer-* prefix convention used by
      sibling volume-mount capabilities such as mount-volume (devcontainer-home).
