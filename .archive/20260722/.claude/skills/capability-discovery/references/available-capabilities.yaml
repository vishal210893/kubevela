      (letters, marks, and digits of every script, plus script-native
      punctuation like CJK and fullwidth forms).

      Two hooks enforce the rule at tool-call time: a PreToolUse hook on
      Write/Edit/MultiEdit/NotebookEdit content, and a PostToolUse hook on files
      written by Bash (heredoc, sed -i, tee, ...). The normalize-ascii CLI fixes
      a file in one shot -- converting the unambiguous substitutes and reporting
      anything ambiguous for a human to decide. A rule doc states the policy.

      The design goal is to catch all the accidental abuses while letting through
      the uses that have a high probability of being legitimate; the few genuine
      symbol exceptions are handled by temporarily disabling the hooks.

