  - name: spec
    summary: Spec-driven development workflow
    description: |-
      Spec-driven development (SDD) transforms ideas into formal specifications before you
      write code. Requirements, design, and tasks become traceable documents that give Claude
      full context across sessions, across team members, and across context resets. The core
      loop: Idea -> Requirements -> Design -> Tasks -> Implement -> Verify, with each step
      refining the previous ones until you ship.

      Use SDD when a feature touches multiple components, multiple people need to understand
      the change, or you want Claude to have full context across sessions. Skip it for small
      bug fixes, typo corrections, simple refactoring, or exploratory work.


      Getting Started

      Run /spec:setup once per repository (interactive wizard) to configure where specs live,
      the project name, and the steering-context injection mode. Then run /spec:steering to
      analyze the codebase and generate three steering documents: product.md (what is this
      project, who uses it), tech.md (stack, build tools, conventions), and structure.md (how
      the code is organized). Steering docs are injected into Claude sessions based on the
      steering-context config: spec-branch (default, inject when a spec is associated with a
      non-main branch), any-branch, always, or manual. Optionally add constitution.md for
      immutable project principles -- /spec:requirements, /spec:design, and /spec:tasks all
      read this and use it as generation context.


      Typical Workflow

      Start by creating a GitHub issue to track the work (/issue), then create a spec
      directory and associate it with your branch (/spec:create auth-perms, then /spec
      auth-perms). Load any relevant subsystem context docs (/spec ::+auth). Then
      generate documents in sequence:

      /spec:requirements generates formal requirements using EARS notation (Ubiquitous,
      Event-driven, State-driven, Conditional, Optional patterns). /spec:design produces
      the technical design from those requirements. /spec:tasks breaks the design into
      sequenced implementation tasks with declared dependencies. Run /spec:interview at
      any point to do interactive Q&A that identifies gaps and refines the requirements.

      Implement with /spec:impl -- called repeatedly, it picks the next unchecked task,
      loads the full spec context (requirements, design, tasks), checks dependencies, and
      marks the checkbox on completion. Target specific tasks with /spec:impl 1.1 or
      ranges like /spec:impl 1.1-1.5. When done, /spec:verify checks task completion,
      requirements traceability, design coherence, and cross-artifact consistency.

      The same workflow works as a plain prompt: "Create an issue, create a spec called
      auth-perms, load steering and auth context, generate requirements, interview me for
      gaps, generate design and tasks, implement all tasks, verify against the spec, then
      commit, push, and create a PR." Or collapse to a single command:
      /issue "Add role-based permissions" --spec auth-perms --impl --pr


      Brainstorming

      /spec:brainstorm spawns parallel agents to independently explore
      a topic from different expert perspectives, then merges all outputs into a single
      synthesized document with executive summary and ranked recommendations. Default
      personas are strategist, chief-architect, chief-programmer, and delivery-manager --
      all grounded in real delivery experience and mandated to research and validate
      recommendations against proven patterns from best-in-class software companies.
      Use --personas to select from the full roster: visionary, pragmatist, critic, analyst,
      user-advocate, contrarian, optimizer, historian, provocateur, synthesizer, and more.
      With --spec, output writes directly into a spec directory.


      Context Management

      Contexts control which steering and subsystem docs are loaded for a branch.
      /spec ::+auth appends the auth subsystem docs; /spec ::steering,auth replaces
      all contexts for the branch. Context refs use project.name dot notation for
      cross-project references -- steering is reserved for the steering/ directory,
      all other names resolve under ctx/. Cross-project refs like workflow.deployment
      resolve against that project's doc root. On every session start or /clear, the
      SessionStart hook loads steering docs (based on the steering-context config mode),
      the associated spec's files (if the branch has a spec), and any subsystem contexts
      set for the branch. Associations persist in ~/.dev/dev.yaml and
      survive across sessions and machines.


      Spec Management

      /spec:list shows all specs with branch associations and completion status.
      /spec:rename renames the spec directory. /spec:remove deletes it (git history
      preserves all the documents).
      /spec:prune cleans up orphaned branch-to-spec associations left behind by deleted
      branches. /spec:playback generates persona-based narratives (executive, developer, QA)
      from the spec documents for stakeholder communication.
