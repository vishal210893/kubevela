  - name: doctor
    summary: Diagnose common devcontainer, host, and workspace health issues
    description: |-
      `dev doctor` runs a checklist of "is this devcontainer + host + workspace
      actually healthy" diagnostics and prints pass / warn / fail with a fix hint
      for each finding. It's intended to replace the recurring Slack pattern of
      "my container is weird" -> "oh, you need to refresh AWS SSO / install socat
      on the host / rebuild a stale image" with one command that knows the
      common foot-guns.

      MVP checks (run `/doctor --list` for the live registry):
        - aws-creds: active AWS profile's SSO session is valid (narrow classifier)
        - host-socat: socat is on the host PATH (only when dynamic-ports is active)
        - image-age: container image was rebuilt within the last 14 days
        - low-disk: container root volume has more than 15% free
        - mcp-servers: configured MCP servers are reachable (failed vs needs-auth)
        - npm-registry: default npm registry resolves public packages
                        (catches a default mis-pointed at gwai-npm-release)
        - host-clock-skew: container clock within 60s of an external reference
                          (opt-in via DEV_DOCTOR_CLOCK_ENDPOINT)
        - git-hook-bypass: recent commits authored by the current user carry a
                          ticket reference (heuristic for `git commit --no-verify`)

      Each check is a small function that returns ok / warn / fail / skip, a
      one-line message, and a fix hint. Adding a new check is a single function
      -- no protocol or schema changes required for the MVP. A v2 extension
      point (a `doctor:` block in capability.yaml so other capabilities can
      register their own checks) is intentionally deferred.

      Output modes:
        - default: human-readable, color-coded, summary at top
        - --json: machine-readable, suitable for statusline / CI
        - --quiet: suppress output; exit code reflects worst severity
                  (0=ok, 1=warn, 2=fail) -- suitable for pre-commit / dev up
        - --check <name>: run a single named check only (repeatable)
        - --list: enumerate registered checks

      The capability is opt-in. Add `doctor` to your profile's capabilities list
      to enable the slash command and the `doctor` shell shim.
