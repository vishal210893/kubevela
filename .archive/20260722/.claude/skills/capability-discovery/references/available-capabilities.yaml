  - name: cdp.gradle-credentials
    summary: Bind-mount host ~/.gradle/gradle.properties for Artifactory auth
    description: |-
      Bind-mounts the host's ~/.gradle/gradle.properties into the container at
      /home/node/.gradle/gradle.properties so Gradle builds in the CDA repos
      (cloud-data-access, powerline) authenticate with Guidewire Artifactory using
      the developer's existing host-side credentials -- no env-var plumbing.

      The CDA build files resolve credentials as
      findProperty("artifactoryUsername") ?: System.getenv("ARTIFACTORY_USERNAME")
      (and the password equivalent). The repos ship a project gradle.properties
      with SET_ME placeholders, and because findProperty() returns that non-null
      placeholder the getenv fallback never fires. The user-home gradle.properties
      has higher precedence than the project file, so the mounted host values
      override the SET_ME placeholders without touching the repo files.

      ensure-exists: file creates an empty ~/.gradle/gradle.properties on the host
      if it is missing (via the mount-bind capability's pre-create step), so the
      mount never fails on a clean machine.

      Note: the gradle-cache capability mounts ~/.gradle as a Docker volume; this
      file bind-mount nests inside that path and overlays gradle.properties, which
      is the intended behavior (host creds win over the cached volume copy).
