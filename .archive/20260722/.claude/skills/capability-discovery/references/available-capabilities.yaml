  - name: ccbridge
    summary: Install ccbridge -- IntelliJ plugin + launcher bridging Claude Code to headless IntelliJ
    description: |-
      The ccbridge capability turns the multi-step ccbridge setup into a
      one-command install via `dev profile install`. It clones the
      gwre-pdo/ccbridge repo to ~/.local/tools/ide-bridge/ccbridge, downloads
      the latest release zip into
      ~/.local/tools/ide-bridge/ccbridge/build/distributions/ (so the
      launcher's plugin loader has the artifact ready), and adds
      ~/.local/tools/ide-bridge/ccbridge/scripts/ to PATH so the `ccbridge`,
      `ccbridge-headless.sh`, `ccbridge-doctor.sh`, etc. CLIs are available
      on every shell.

      ccbridge itself is the IntelliJ plugin host described in the
      gwre-pdo/ccbridge repo: an HTTP-server plugin that exposes IDE
      operations (search-replace, build, run-test, /studio-compile, etc.) so
      Claude Code can drive a headless IntelliJ. After install, the
      user runs `ccbridge-headless.sh /path/to/project` to start a per-project
      IntelliJ JVM.

      The ide-bridge mount (~/.local/tools/ide-bridge/) is itself a Docker
      volume declared by this capability so the source checkout, release zip,
      and any local plugin builds (./gradlew buildPlugin) survive container
      rebuilds. The mount also sidesteps the parent-directory ownership
      problem -- ~/.local/tools/ is created root-owned by Docker when it
      sets up sibling volume mounts (e.g., the intellij-cache mountpoint),
      so install-ccbridge.py cannot create ~/.local/tools/ccbridge as the
      container user; declaring ide-bridge as its own volume gives
      mount-bind's chown step a mountpoint to own and install-ccbridge.py
      finds an empty, node-owned target ready for cloning into a ccbridge/
      subdirectory.

      The ide-bridge/ parent is intentionally brand-neutral: future bridges
      (e.g., a unified ccbridge+devassistant successor) live as siblings
      under the same volume rather than fragmenting across multiple volumes.

      Tier-1 IntelliJ binary cache (~/.local/tools/intellij/) is owned by
      the intellij-cache capability (declared as a prereq) so the
      ~1.5 GB IntelliJ install survives container rebuilds. Project-index
      cache (~/.cache/ccbridge/) is owned by the ccbridge-index-cache
      capability (also a prereq) so the 6-10 minute per-project re-index
      cost on container rebuild becomes a sub-minute warm restart.

      The install script is idempotent: on re-run it fetches the latest
      release if available and skips otherwise. It falls back gracefully
      when no release has been published yet -- the user can build from
      source by running `./gradlew buildPlugin` in the cloned repo.

      The ccbridge version installed tracks the latest GitHub Release. To
      pin to a specific version, set CCBRIDGE_PIN_VERSION in the container
      environment (e.g. via a profile hook) before the post-create script
      runs.
