  - name: app-plat.cross-repo-review
    summary: Cross-repository feature review for multi-repo changes
    description: |-
      A single Jira ticket often requires changes across multiple repositories --
      Odin for API definitions, a backend service, and a frontend UI. Reviewing
      each PR in isolation misses contract mismatches, phantom enum values, missing
      repo changes, and incorrect merge ordering. This capability discovers all
      related PRs and reviews them together.

      Getting Started

      Run the command with a Jira ticket or PR URLs:

        /cross-repo-review APDS-5830
        /cross-repo-review https://github.com/org/repo/pull/1 \
                           https://github.com/org/repo2/pull/2

      The command searches the entire gwre-pdo org for open and recently merged PRs
      matching the ticket, confirms the discovered set with you, then dispatches two
      parallel review agents that each fetch fresh diffs via gh pr diff.

      Typical Workflow

      1. You finish a feature that touches odin, pca-service, and pca-ui
      2. Run /cross-repo-review APDS-5830
      3. The command discovers 3 PRs across repos (including ones you may have missed)
      4. Two agents review in parallel: contract alignment and completeness
      5. You get a consolidated report with findings per repo, merge order, and a
         recommendation (approve / fix before merge / block)

      What It Catches

      - UI enum type includes values not in the API contract (latent 400 errors)
      - Service api.yml hand-edited without updating Odin (spec drift)
      - Pre-existing spec drift in unrelated schemas
      - Write path stores a field but read path drops it (data loss)
      - Missing tests for new sort key patterns
      - Out-of-scope changes bundled from different Jira tickets
      - Incorrect or undocumented merge ordering
