  - name: claims.arch-check-on-git-commit
    summary: Detect architecture / dependency violations in TS/JS commits
    description: |-
      PostToolUse hook on `git commit` that runs three import-hygiene checks on
      the commit's TS/JS source files entirely in-process and blocks the
      post-commit return only when concrete violations are detected:

        - **Fan-out** -- distinct imports per file. Default threshold: 15.
        - **Cyclic imports** -- cycles in the import graph rooted at changed
          files, expanded one extra level so cycles that close through an
          unchanged neighbor are still caught.
        - **Deep / internal imports** -- targets matching `/internal/`,
          `/private/`, or single-underscore-prefixed mid-path segments.
          `__tests__` and `__mocks__` are not flagged.

      Clean commits exit silently. The hook is self-contained -- it does not
      delegate analysis to Claude. The qualitative spec-driven review lives
      in the sibling `spec-arch-review-on-git-commit` capability.

      **File-level opt-out:** include `// arch-check: ignore` (case-insensitive)
      near the top of a file (within the first 30 lines) to exclude it from
      all checks. Useful for legitimate barrels, generated code, or framework
      adapters where the smell is intentional.

      **Skip the whole hook for a commit** with either:
        - `[skip-checks: arch]` (this hook only)
        - `[skip-commit-checks]` (skip every commit-side hook)
