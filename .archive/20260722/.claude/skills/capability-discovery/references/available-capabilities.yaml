  - name: claude
    summary: Claude Code configuration and IDE integration
    description: |-
      The claude capability wires Claude Code into your devcontainer so it is ready the moment
      the container starts. It installs the IDE extension for VS Code (anthropic.claude-code)
      and the plugin for JetBrains IDEs (com.anthropic.code.plugin), so Claude Code is
      available in whichever editor you open against the container.

      Your Claude Code configuration directory (~/.claude), authentication file
      (~/.claude.json), and global CLAUDE.md instructions file are all mounted from your host
      into the container. This means your auth token, custom commands, scripts, skills, rules,
      and personal preferences are present immediately after the container starts -- no manual
      setup or re-authentication required after a rebuild. The post-create script initializes
      required subdirectories so Claude Code can write its state files without errors on first
      launch.

      This is what makes "batteries included" AI development work. You open VS Code, the
      devcontainer starts, and Claude Code is authenticated and configured with your full
      personal setup. A set of login-script aliases (ccl, cccl, ccrl) are also provided for
      terminal sessions entered via dev sh, launching Claude Code with the profile's MCP
      server configuration active.
