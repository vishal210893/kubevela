  - name: mount-bind
    summary: Host volume mounts for shell config and npm registry
    description: |-
      Every time a devcontainer starts fresh, it loses any customizations you had in the
      previous session. mount-bind solves this by bind-mounting specific files from your host
      machine directly into the container, so your personal configuration is always present
      regardless of how many times the container is rebuilt.

      Several host files are mounted by default. The file ~/.zshrc.local is sourced
      automatically by zsh on every interactive container login, making it the right place
      for personal aliases, functions, and environment variables that should follow you
      everywhere. The file ~/.zshenv.secrets carries secret VALUES (tokens, registry
      credentials) and is sourced by ~/.zshenv for ALL shells -- interactive and
      non-interactive -- so tooling that never sources ~/.zshrc (gradle launchers, the
      ccbridge headless launcher, MCP subprocesses) still gets the env; it is created mode
      600 and must never be committed. The file ~/.npmrc carries your npm registry URLs,
      authentication tokens, and scoped package configuration into the container so npm
      install works against your private registries without any extra steps. The files are
      created empty on your host if they do not yet exist, so the mount never fails on a
      clean machine.

      Bind mounts are live in both directions: edits you make to ~/.zshrc.local or ~/.npmrc on
      the host are immediately visible inside the container, and vice versa. This is the key
      difference from volume mounts, which copy data at creation time and are not directly
      editable from the host. mount-bind is intentionally scoped to small configuration files;
      for whole-directory persistence with native I/O performance, see the mount-volume
      capability instead.
