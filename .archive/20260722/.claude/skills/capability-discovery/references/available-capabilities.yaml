  - name: mcp-github
    summary: GitHub MCP server for repository, issue, PR, and code search access
    description: |-
      The mcp-github capability adds the official GitHub MCP server, giving Claude Code direct
      access to the GitHub API for reading repository data, issue content, pull request
      details and discussion history, and code search results. The server is enabled
      automatically when the GH_TOKEN environment variable is present, so no manual activation
      step is required.

      This capability is distinct from what the gh capability provides. The gh capability
      offers slash commands for workflow automation such as creating pull requests and
      managing issues through explicit commands you invoke. The mcp-github capability gives
      Claude passive access to GitHub data during any conversation, so it can look up context
      on its own without you having to ask explicitly. For example, when you paste a PR number
      and ask Claude to review the changes, it can read the PR description, comments, and
      linked issues directly rather than waiting for you to summarize them.

      The same GH_TOKEN used by the gh capability is required here. If you have already
      configured that token for gh, mcp-github will work without any additional setup.
