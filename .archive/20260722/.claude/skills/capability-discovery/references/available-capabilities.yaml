    description: |-
      This capability adds tooling specifically for Python LLM development on top of the base
      Python environment provided by lang-python. The central tool is uv, a fast Python
      package manager and script runner written in Rust. Compared to pip, uv resolves and
      installs dependencies an order of magnitude faster, handles virtual environment creation
      automatically, and supports PEP 723 inline dependency metadata - a pattern used
      extensively throughout the dev tool's Python scripts, where a script declares its own
      dependencies in a header comment and uv runs it directly without any separate setup
      step.

      UV_PROJECT_ENVIRONMENT is set to .venv-devcontainer so that uv sync and uv run create a
      devcontainer-specific virtual environment directory relative to each project root. This
      keeps the in-container venv separate from the default .venv that may exist on the host
      checkout, allowing the same repository to be worked on both locally and inside the
      container without the two environments interfering with each other.

      The just command runner is installed via a post-create script that downloads the latest
      binary from GitHub releases. Just provides project-level task automation through
      justfiles and is the standard build, test, and deploy runner in CCS Python LLM projects.
      The combination of uv for dependency management and just for task orchestration covers
      the complete development workflow for Python LLM projects without requiring heavyweight
      tooling.
