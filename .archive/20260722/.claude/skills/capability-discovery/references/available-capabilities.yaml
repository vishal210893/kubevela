      When you run a dev server inside a devcontainer, the port it listens on is not
      automatically reachable from your host machine. app-ports adds explicit host port
      bindings so that port 3000 (frontend dev servers such as React, Next.js, and Vite)
      and port 8080 (backend servers such as Spring Boot and Express) are accessible at
      http://localhost:3000 and http://localhost:8080 in your browser or API tooling
      without any additional configuration.

      The bindings are scoped to 127.0.0.1, meaning they are only reachable from your
      local machine and are not exposed on the network. This is important for security
      when running development servers that may not have authentication. The capability
      works in both VS Code devcontainer and CLI-based workflows, but is particularly
      valuable in CLI contexts such as dev sh and the devcontainer CLI where VS Code's
      automatic port forwarding is not available.

      This capability is intentionally excluded from concurrent profiles. Port numbers
      are globally unique on a host, so running two containers that both bind port 3000
      will cause the second one to fail at startup. If you need to run multiple
      devcontainers simultaneously, use the standard-concurrent profile, which omits
      app-ports to avoid conflicts. app-ports is for single-container workflows where
      you want immediate, friction-free access to your dev server from the host.
