      It works through a rule, not a hook. A Stop hook of type mcp_tool cannot reach
      a claude.ai-managed connector (it fails with "MCP server not connected"), so
      this capability instead loads a rule that asks the agent -- which CAN reach
      your connector -- to send the message itself via slack_send_message when it
      completes your request. Because the agent decides, it pings only on genuine
      completion and stays quiet on trivial turns and questions, and the message can
      summarize what finished. The tradeoff is that delivery is best-effort, not
      guaranteed.

