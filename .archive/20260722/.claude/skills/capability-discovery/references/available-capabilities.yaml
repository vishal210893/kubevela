  - name: gh
    summary: GitHub issue management
    description: |-
      The gh capability adds GitHub issue management on top of the git capability's
      branch and PR infrastructure. Where git handles commits, branches, and pull
      requests at the repository level, gh builds the GitHub layer on top of that:
      creating and tracking issues, wiring issues to branches, and driving the
      complete workflow from idea to merged PR. The gh capability requires git as a
      prerequisite and extends it with GitHub-specific context.

      The centerpiece is the /issue command, which handles the full issue-to-branch
      setup in one step. Create a new issue by passing a title, or reference an
      existing one by omitting the title. Either way, /issue creates a properly
      named branch, pushes it to the remote with upstream tracking, and optionally
      associates a spec. Pipeline flags let you go further without switching
      commands: --impl begins implementation immediately, --pr commits and opens a
      pull request when done, --poll monitors CI checks, --fix enters an autonomous
      loop to repair failing checks, and --merge combines all of those into a
      single fire-and-forget invocation that lands the change on main.

      For ad-hoc issue browsing, viewing, commenting, and closing, use GitHub MCP
      tools or the gh CLI directly.

      Authentication requires a GH_TOKEN environment variable or an interactive
      gh auth login session. Full credential setup instructions are in the setup
      section below.

      Official plugins do not cover PR lifecycle (merge, poll, fix), issue-to-branch
      workflows, or pipeline automation. This capability provides the full workflow.
