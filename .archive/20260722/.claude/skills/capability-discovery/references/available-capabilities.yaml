  - name: dynamic-ports
    summary: Automatic port forwarding from container to host
    description: |-
      Automatically detects TCP listeners inside the devcontainer and forwards
      them to localhost on the host. Services bound to 0.0.0.0 or 127.0.0.1
      inside the container are reachable at localhost:<port> on the host,
      without port-mapping declarations or container rebuilds.

      Architecture: a single daemon runs on the host per workspace, spawned by
      an initialize-script during `dev up`. The daemon polls `ss -tlnH` inside
      the container via `docker exec` and spawns `socat` forwarders on the host
      for each detected listener. When a listener disappears, the forwarder is
      torn down. No daemon or agent runs inside the container.

      Container prerequisites (socat + iproute2) are installed via a
      devcontainer feature during image build, with apt-secure GPG verification.
      Host prerequisite is `socat` on PATH (macOS: `brew install socat`;
      Linux: `apt install socat`); the launcher checks at startup.

      See specs/dynamic-ports/design.md for the full architecture.
