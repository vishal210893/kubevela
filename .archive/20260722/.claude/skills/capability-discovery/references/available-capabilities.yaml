  - name: quiet
    summary: Suppress noisy build/test/lint output to keep Claude's context clean
    description: |-
      Build tools, test runners, and linters routinely emit hundreds or thousands of lines
      on success -- webpack progress bars, Maven lifecycle banners, Go compilation traces,
      pytest collection headers. Claude reads all of it, burning context window for zero
      informational value. The quiet capability fixes this with a two-part system:

      A PreToolUse hook watches for known noisy commands (tsc, eslint, jest, go build,
      mvn, gradle, pytest, and others) and rewrites them to run through a quiet wrapper
      script. The wrapper suppresses all output on success and surfaces only error hints
      and the last 60 lines on failure. The result: Claude gets silence when things work
      and focused diagnostics when they don't.

      The wrapper is conservative -- it never hides failures, and it preserves the full
      log in a temp file that Claude can read if it needs more detail. Commands that
      already pipe or redirect output are left untouched, as are commands that already
      use the quiet wrapper or check_* scripts.

      The pattern list covers TypeScript/JavaScript (tsc, eslint, jest, npm/yarn build),
      Go (go build, go test, go vet, golangci-lint), Java (mvn, gradle/gradlew), and
      Python (pytest). Teams can extend the list by adding patterns to the
      QUIET_PATTERNS dictionary in the hook script.
