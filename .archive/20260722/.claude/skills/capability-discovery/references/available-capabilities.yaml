  - name: ccs.slack-bridge
    summary: Mirror Claude Code sessions to a Slack DM thread and steer them by replying
    description: |-
      Two-way bridge between a Claude Code session and a Slack DM thread.

      When you opt in with /slack-bridge:start the bridge opens a DM to you and starts
      a fresh thread (lazily, on the next tool call or turn). Through the session it
      mirrors the terminal experience to the thread: each assistant text block as
      Claude writes it (mid-turn), a diff for every file edit, a one-line note per
      other tool, AskUserQuestion prompts you answer by replying (the local picker is
      suppressed), and tool-approval prompts you approve or deny by replying. It polls
      the thread for your replies -- a reply is fed back as Claude's next prompt, so
      you can steer the session from Slack just like the terminal prompt. Replies
      steer the session while it is alive (the Stop hook waits for them, up to 24h by
      default); once the CLI exits, the session is over. Each mirror has its own
      on/off flag (SLACK_STREAM_PROSE, SLACK_STREAM_DIFFS, SLACK_REMOTE_PROMPTS,
      SLACK_REMOTE_PERMISSIONS), all on by default.

      OFF by default and opt-in per session. Installing the capability changes
      nothing until you opt in with /slack-bridge:start, which mirrors only the
      session you run it in -- other sessions are unaffected and each new session
      stays off until you start it. /slack-bridge:stop turns the current session back
      off (use stop --all to stop every session at once), and a session's opt-in is
      cleared automatically when it ends. All hooks are best-effort and fail open --
      a Slack or network error never disrupts the local CLI session.

      Credentials are read from the ENVIRONMENT first (passed through to the
      container) and from the optional ~/.claude/slack-bridge/config.env second; the
      environment wins. Two auth methods are supported, both needing SLACK_DM_USER_ID:
      (A) a static bot token in SLACK_BOT_TOKEN (xoxb-), simplest when the app has no
      token rotation; or (B) the OAuth authorization-code flow for apps with token
      rotation -- set SLACK_CLIENT_ID/SLACK_CLIENT_SECRET, run `slack-bridge-ctl.sh
      auth-url`, approve in the browser, and pass the redirect URL to `auth-code`.
      The bridge then stores access + refresh tokens in oauth.env and refreshes
      automatically (rotating the refresh token). A static token wins when both are
      set. The app needs the chat:write, im:write and im:history scopes. config.env
      is otherwise only needed for the tuning knobs; a template is seeded the first
      time you run /slack-bridge:start.

      SLACK_DM_USER_ID may be omitted: when a token (or OAuth app) is configured but
      no DM target is set, /slack-bridge:start resolves your Slack member ID from the
      Slack MCP and caches it in resolved.env. An explicit SLACK_DM_USER_ID in the
      environment or config.env always takes precedence over the cached value.

      Prerequisite: this auto-resolution needs a Slack MCP connector to be connected
      in this Claude Code session (the /slack-bridge:start command calls it to read
      your member ID). It is optional -- if you set SLACK_DM_USER_ID yourself, no MCP
      is required. The bridge itself posts to Slack over the bot token / OAuth via
      curl, never through the MCP.

      Clearing state. /slack-bridge:stop clears a session's runtime state -- it drops
      the opt-in marker, the state file, and closes the thread for the current
      session (stop --all for every session); this also happens automatically when a
      session ends. /slack-bridge:clear-auth clears cached CREDENTIALS instead: by
      default just the OAuth token store (oauth.env), and with --all also config.env
      and the resolved-DM cache (resolved.env), fully deconfiguring the bridge.
      clear-auth never changes any session's on/off state, and stop never touches
      credentials.
