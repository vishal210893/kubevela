  - name: compress-markdown
    summary: On-demand compressed markdown for token-efficient AI-facing docs
    description: |-
      AI-facing markdown files -- CLAUDE.md, rules, skills, agent
      system prompts -- load into context every session. A verbose
      38 KB file costs ~9,000 tokens each time Claude starts.
      Compressed markdown reduces that by 60-80% using
      keyword-dense, separator-structured format while preserving
      every decision-changing fact. The savings compound: across
      a team running dozens of sessions per day, even modest
      per-file reductions add up to significant cost and latency
      improvements.

      This capability provides two things:

      1. A skill (compress-markdown) that teaches the 5-pass
         compression technique: classify each line, rewrite
         survivors into [Label]facts|triggers|mappings, dedup,
         split mixed blocks, and quality-test the result. The
         skill includes a Gate 0 check that classifies the
         target as AI-facing, human-facing, or mixed, plus a
         Gate 0.1 warning for build outputs that would be
         overwritten on next build.

      2. A /compress command that takes a file path and runs
         the full compression pipeline. Claude reads the file,
         loads the skill, applies the technique, and writes the
         compressed version back. One command, no manual editing.

      Before:
        "This is an offline-first family management app built
         with React Native and Expo using TypeScript. It
         supports optional end-to-end encrypted relay sync."

      After:
        [Project]offline-first family app|RN/Expo/TS|E2EE sync

      The capability is optional. Add compress-markdown to your
      profile's capabilities list to enable it. When not invoked,
      it adds zero overhead -- the skill loads only on demand and
      the command exists only as a dormant slash command.
    installed: false
