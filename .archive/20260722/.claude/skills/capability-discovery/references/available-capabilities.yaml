  - name: app-plat.estimate-stories
    summary: Suggest story-point estimates from team history and write them back to Jira
    description: |-
      Standalone, project-agnostic Jira story-point estimator. It reads the scope
      of the actual work (description + acceptance criteria, optionally the cited
      code), sizes the change, and reconciles that first-principles read against
      recently-completed similar stories from the same team — grounded in those
      stories' real PR diff sizes. Emits a recommended point, a range, and the one
      size-moving unknown, with a confidence level (High/Medium/Low) and a
      two-voice plain-English rationale. Can output "split this" when a story is
      too large, or "too vague to estimate" when there is neither history nor a
      meaningful description to anchor on.

      Everything sizes in one currency — change magnitude (PR diff size primary,
      duration fallback) — then maps to points via the team's own
      points-to-magnitude calibration, so the scope read stays anchored and can
      never emit a size the team's history doesn't support (sparse calibration
      degrades to directional-only, history leads). Dependency links are scanned:
      an open "is blocked by" widens the range and lowers confidence. Team-scoping
      means the estimate is calibrated to the estimating team's own point scale;
      it needs the team field (`pod_field`, configurable) populated and degrades
      to project-wide calibration otherwise.

      Works for any project in the Jira tenant: each key's project is derived from
      its prefix, so a single run can mix keys from different projects. Primary use
      is standalone via `/estimate-stories APDS-3001,PLAT-77`; a concise verdict
      mode (`--brief`, or auto on large runs) emits one line per key. It can also
      be invoked by any other skill through the `Skill` tool (passing a
      comma-separated key list via `args`) — `sprint-planning`'s estimation gate
      is one example caller, not the owner.

      Code and PR inspection are bounded (cited files only, top few PRs) and
      read-only (rg/Read/gh, never find). All Jira reads/writes go through the
      mcp__jira__* tools. No write happens without explicit user confirmation per
      issue.
