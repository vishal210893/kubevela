  - name: iterm
    summary: Forwards iTerm2 / terminal-detection env vars from host to container
    description: |-
      The iterm capability forwards two host environment variables -- TERM_PROGRAM and
      ITERM_SESSION_ID -- into the devcontainer so that tools running inside can detect
      when they are attached to an iTerm2 session and emit iTerm2-specific escape
      sequences (alerts, notifications, marks).

      The motivating use case is Claude Code's notification path: when Claude Code
      detects TERM_PROGRAM=iTerm.app and a non-empty ITERM_SESSION_ID, it emits OSC 9
      (and related) sequences that surface as native iTerm2 alerts on the host. Without
      these variables, the container shell looks like a generic terminal and the alert
      is silently dropped.

      Both variables are pure pass-throughs; nothing is set when the host shell is not
      iTerm2 (TERM_PROGRAM may still be set to "Apple_Terminal", "vscode", "ghostty",
      etc., which is also useful information for terminal-aware tools). The variables
      resolve to empty strings on hosts that do not set them, so the capability is safe
      to enable unconditionally on macOS, Linux, and Windows hosts.

      No mounts, scripts, or extensions are added -- this capability is environment
      variables only.
