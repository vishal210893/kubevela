  - name: docker-in-docker
    summary: Docker-in-Docker with daemon initialization and DOCKER_HOST fix
    description: |-
      Docker-in-Docker (DinD) runs a fully isolated Docker daemon inside the
      devcontainer itself, completely separate from any Docker daemon on the host
      machine. This is achieved via the ghcr.io/devcontainers/features/docker-in-docker
      feature, which installs Docker CE inside the container, combined with the
      --privileged run argument that grants the inner daemon the kernel access it
      needs to manage namespaces and cgroups. A post-start script (docker-init.py)
      starts the inner dockerd on every container startup, waits up to seven seconds
      for the socket at /var/run/docker.sock to become responsive, and then exits --
      leaving the daemon running in its own process group so it survives the script
      timeout.

      Because the docker CLI inside the container talks to the inner daemon, all
      images, containers, volumes, and networks are completely isolated from the host.
      A docker build or docker run inside the container cannot affect the host's image
      cache or running containers. This isolation makes DinD well-suited for CI-like
      workflows, testing Docker Compose stacks, and security-sensitive scenarios where
      you do not want container builds leaking state onto the host.

      The trade-off is cost: --privileged grants broader kernel access than most
      workloads require, and running two Docker daemons (host plus inner) carries
      measurable overhead. The inner daemon starts cold with an empty image cache, so
      the first pull of any image takes longer than it would with a shared host cache.
      For workflows that prioritise speed and do not require isolation, the
      docker-outside-of-docker capability is a lighter alternative.

      A login script (docker-host-fix.sh) runs in every terminal session to defend
      against a common Mac-specific issue: shell dotfiles such as ~/.zshrc.local
      sometimes leak a host-specific DOCKER_HOST value (for example, Rancher
      Desktop's unix://$HOME/.rd/docker.sock) into the container environment. If
      DOCKER_HOST points to a unix socket that does not exist inside the container,
      the script unsets it so the docker CLI falls back to the default
      /var/run/docker.sock provided by the inner daemon.
