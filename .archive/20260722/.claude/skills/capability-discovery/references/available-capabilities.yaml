  - name: app-plat.ispl-setup-repos
    summary: First-run offer + re-runnable command to clone the IS repos into ~/src
    description: |-
      Cloning the Insurance Suite repos is how work gets done in this profile,
      but the profile does not clone anything by default (keeps CI and rebuilds
      clean, and respects users who manage their own checkouts).

      Instead, on the FIRST interactive shell, a login-script offers to clone the
      five IS repos into ~/src, prompting for each one individually. Every prompt
      defaults to no -- each repo is an explicit opt-in:

        - ispl-pl  (Platform)
        - ispc-pc  (PolicyCenter)
        - iscc-cc  (ClaimCenter)
        - isbc-bc  (BillingCenter)
        - isab-ab  (ContactManager)

      Per-repo prompting matters because needs differ: a CC developer typically
      wants iscc-cc plus ispl-pl, while a platform developer wants all five. Many
      app developers do not work in platform, so nothing defaults to yes.

      In interactive use nothing is cloned without an explicit yes (the `--yes`
      flag on the command is the sole, deliberately non-interactive exception).
      The offer is shown once: after a clean run (completed, declined every repo,
      or unattended timeout) it writes a marker at ~/src/.ispl-repos-offered and
      never pesters again. A crash or Ctrl-C leaves no marker, so an interrupted
      offer recurs next shell rather than being silently lost. The marker lives on
      the src volume, so it survives container rebuilds and resets only on a
      genuinely fresh src volume.

      The same logic is exposed as a re-runnable command, `ispl-setup-repos`, so a
      user who skipped a repo can clone it later without waiting for a first run.
      It auto-detects ssh vs https from gh / ssh config (override with
      GIT_CLONE_PROTOCOL=ssh|https), skips any repo already present in ~/src, and
      surfaces (without clobbering) any half-finished clone it finds.

      Unattended-safe: in --first-run every prompt has a timeout, so a shell left
      unattended -- idle from the start or abandoned mid-sequence -- skips the rest
      rather than hanging or auto-cloning a large repo.
