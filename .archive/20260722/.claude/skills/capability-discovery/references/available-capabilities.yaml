  - name: app-plat.termbridge
    summary: HMAC-authed Mac daemon that types text into specific iTerm2 sessions (off by default)
    description: |-
      termbridge is a Mac-side HMAC-authed HTTP daemon (port 7474) that wraps
      iTerm2's AppleScript "write text" interface. Container-side workers
      register a Claude session against an iTerm pane; any consumer
      (slackbridge, plbot, or future agent-to-agent flows) can POST text to
      the daemon to inject into a specific pane.

      Repo: https://github.com/gwre-pdo/termbridge

      ## Opt-in via TERMBRIDGE_ENABLED

      This capability is gated on the host environment variable
      TERMBRIDGE_ENABLED. With it unset or false, the capability is a
      silent no-op (env passthrough only -- no daemon install, no hooks).
      Set TERMBRIDGE_ENABLED=true on the host before `dev profile install`
      to activate.

      ## End-to-end enablement (Mac users only)

      1. Clone the termbridge repo into your workspace (one-time):

           gh repo clone gwre-pdo/termbridge ~/dev/pl/termbridge

         (The default expected location is $HOME/dev/pl/termbridge. Override
         with TERMBRIDGE_DIR=<other-path> if you keep it elsewhere.)

      2. Export the enable flag in your shell init (e.g., ~/.zshrc.local
         or ~/.zshenv):

           export TERMBRIDGE_ENABLED=true

      3. Re-run profile install so this capability activates:

           dev profile install

         The host-side hook runs $TERMBRIDGE_DIR/install-mac.sh
         (loads the launchd daemon, generates a worker token).
         The container-side hook runs $TERMBRIDGE_DIR/install-container.sh
         on devcontainer post-create (writes env block, wires the
         SessionStart hook).

      4. Per Claude session: in an iTerm2 pane, run termbridge-claim and
         then claude. The session registers itself against that pane.

      5. To stop using termbridge later: unset TERMBRIDGE_ENABLED (or
         remove the export), then unload the daemon manually:

           launchctl unload ~/Library/LaunchAgents/com.guidewire.termbridge.plist

      ## Use cases this capability unlocks

      - **Slack notifications via slackbridge + PagerDuty**: when Claude is
        waiting on a real blocker, slackbridge posts to Slack and fires a
        PagerDuty doorbell so you get a phone notification. Reply in the
        Slack thread, and your reply lands in the right Claude pane via
        termbridge. Slackbridge is a separate package; install after
        termbridge is up. See https://github.com/gwre-pdo/termbridge for
        the slackbridge migration notes.
      - **Inter-agent communication**: agents in different iTerm panes can
        POST messages to each other via termbridge.
      - **Plbot status injection** (future): plbot daemon-mode pane updates
        will optionally route through termbridge instead of tmux.

      ## Configuration env vars

      - TERMBRIDGE_ENABLED: set "true" to activate; anything else = no-op
      - TERMBRIDGE_DIR: where the termbridge repo is cloned (default $HOME/dev/pl/termbridge)
      - TERMBRIDGE_HOST: daemon host:port inside container
        (default host.docker.internal:7474)
      - TERMBRIDGE_DAEMON: daemon URL inside container
        (default http://host.docker.internal:7474)
      - TERMBRIDGE_WORKER_TOKEN: HMAC secret
        (auto-generated by termbridge install-mac.sh)
    installed: false
