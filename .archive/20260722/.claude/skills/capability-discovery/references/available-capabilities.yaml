  - name: maven-cache
    summary: Mount Docker volume at ~/.m2 to persist the Maven repository across containers
    description: |-
      The maven-cache capability mounts a named Docker volume at /home/node/.m2 so that
      the Maven local repository -- downloaded dependencies and plugins -- persists across
      container rebuilds and is shared by every container that includes this capability.
      Cold builds that would otherwise re-download every artifact from Artifactory complete
      in a fraction of the time once the volume has been warmed.

      A Docker volume is used rather than a bind mount to ~/.m2 on the host. On macOS and
      Windows a host bind mount crosses the virtiofs/VM boundary on every read and write,
      which is dramatically slow for the many thousands of small files a Maven repository
      holds; it also risks cross-contamination between host and container builds (differing
      Maven or JVM versions, file-ownership semantics). Keeping the repository inside a
      Docker volume isolates the container's Maven state from any Maven install the host
      may use while still preserving it across rebuilds. This is the Maven counterpart of
      the gradle-cache capability (devcontainer-gradle). The lang-java capability declares
      maven-cache as a prerequisite and no longer mounts ~/.m2 itself, so every profile
      with Java tooling persists its Maven repository on this volume rather than a slow
      host bind.

      The mount is declared with volume-nocopy: true. Combined with mount-bind's
      ensure-mounts initialize script, this ensures the volume starts empty and is chowned
      to the container user (uid 1000) before the container starts, so Maven can write to
      the repository on first use without permission errors. mount-bind is declared as a
      prereq so this capability cannot be installed in a profile that lacks the
      ownership-init machinery.

      To customize the volume name, set DEVCONTAINER_MAVEN_VOLUME on your host before
      installing a profile that includes this capability. The default volume name is
      devcontainer-m2, matching the devcontainer-* prefix convention used by sibling
      volume-mount capabilities such as gradle-cache (devcontainer-gradle).
