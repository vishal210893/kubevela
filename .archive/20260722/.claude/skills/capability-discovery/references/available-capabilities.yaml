    summary: Block accidental non-ASCII typographic/symbol substitutes; allow real-language i18n text
    description: |-
      Catches the non-ASCII characters that LLMs and copy-paste accidentally
      inject as stand-ins for ASCII -- em/en dashes, smart quotes, ellipsis,
