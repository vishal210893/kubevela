  - name: intellij-cache
    summary: Mount Docker volume at ~/.local/tools/intellij for cached IntelliJ binaries
    description: |-
      The intellij-cache capability mounts a named Docker volume at
      /home/node/.local/tools/intellij so cached JetBrains IntelliJ binaries
      -- typically the IDE and a bundled JBR, ~1.5 GB per build -- persist
      across container rebuilds and are shared by every container that
      includes this capability. Tools that need a headless IntelliJ for any
      reason (the ccbridge plugin host, raw `idea inspect` runs, future
      plugin-driven harnesses) can reuse the same cached install rather than
      re-downloading on every container rebuild.

      The convention is for consumers to write their cached install to
      ~/.local/tools/intellij/idea-<version>-<arch>/ -- e.g. ccbridge's
      launcher tier-1 / tier-2 path. Different versions live side-by-side in
      separate subdirectories so a consumer can pick its target without
      fighting another consumer.

      A Docker volume is used rather than a bind mount to ~/.local/tools/intellij
      on the host because the IDE install includes a bundled JBR that's tightly
      coupled to a specific build number; bind-mounting from the host would
      risk cross-contamination if the host has a different IntelliJ install.
      Keeping the cache inside a Docker volume isolates the container's
      IntelliJ state from any IDE the host may use while still preserving it
      across rebuilds.

      The mount is declared with volume-nocopy: true. Combined with mount-bind's
      ensure-mounts initialize script, this ensures the volume starts empty and
      is chowned to the container user (uid 1000) before the container starts,
      so the consumer can write to the cache on first use without permission
      errors. mount-bind is declared as a prereq so this capability cannot be
      installed in a profile that lacks the ownership-init machinery.

      To customize the volume name, set DEVCONTAINER_INTELLIJ_VOLUME on your
      host before installing a profile that includes this capability. The
      default volume name is devcontainer-intellij, matching the
      devcontainer-* prefix convention used by sibling volume-mount
      capabilities (devcontainer-gradle, devcontainer-home).

      Migration note for ispl users: ccbridge v0.9.18- cached its IntelliJ
      binary at ~/.local/tools/ccbridge/intellij/, which lived on the
      legacy mount-volume-tools volume that gradle-cache replaces. After
      this capability lands, the prior cache is no longer mounted and the
      next ccbridge launch falls through to tier-2 (CDN download, ~5 min,
      one-time) to populate the new devcontainer-intellij volume. Reclaim
      the old volume's disk with `docker volume rm devcontainer-tools` once
      you've confirmed the new mount is working.
    installed: false
