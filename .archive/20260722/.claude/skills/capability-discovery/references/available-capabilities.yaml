  - name: claims.complexity-on-stop
    summary: Block Stop on JS files when functions exceed complexity/nesting/parameter limits
    description: |-
      Records every TS/JS source file (excluding test files) that Claude edits
      this turn via a PostToolUse:Write|Edit tracker. At Stop, runs three
      per-function readability checks (decisions and indent inside nested
      function bodies are excluded from the enclosing function's score) and
      blocks the Stop with a consolidated report when any function in a
      tracked file exceeds a threshold:

        - **Cyclomatic complexity** -- decision-point count (`if`, `else if`,
          `for`, `while`, `case`, `catch`, `&&`, `||`, `??`, ternary `?:`)
          within each function body, after stripping comments and string
          literals. Threshold: 30.
        - **Max nesting depth** -- coarse but reliable proxy for nesting,
          measured in indent units relative to the function body's baseline
          (tabs count as 4 spaces). Threshold: 8.
        - **Max parameter count** -- top-level commas inside any function or
          arrow signature (handles destructuring and default values).
          Threshold: 5.

      Function detection handles `function` declarations/expressions and
      arrow functions with block bodies. Object/class method shorthand
      (`name(params) { ... }`) is not detected -- best-effort regex parser,
      no AST.

      Tracker retention: only files that still fail stay in the tracker after
      a block. Files that pass are removed; new edits add normally.

      Question-pause: when Claude's last assistant message ends with a
      question mark, the hook returns silently without clearing the tracker.

      After 2 unsuccessful rounds, the block reason switches to "stop
      refactoring and ask the user" so Claude escalates rather than looping.

      Skip tokens (in the latest user message):
        [skip-checks: complexity]    skip just this hook
        [skip-stop-checks]           skip every Stop-based check
