  - name: mount-volume
    summary: Mount /home/node as Docker volume for native filesystem performance
    description: |-
      On macOS and Windows, Docker Desktop runs containers inside a Linux virtual machine.
      The default overlay filesystem that backs the container's home directory crosses the
      VM boundary for every read and write, producing I/O speeds that are dramatically
      slower than native Linux operations. Real-world impact is significant: npm install
      and Maven builds that take seconds on Linux can take five to ten times longer in a
      stock devcontainer on a Mac or Windows machine.

      mount-volume replaces /home/node with a named Docker volume, keeping all filesystem
      operations inside the Linux VM and delivering native I/O throughput. Because the
      volume lives in the VM rather than on the overlay layer, your ~/.m2 Maven cache,
      ~/.gradle cache, node_modules, and other build artifacts persist across container
      rebuilds. The first time a container starts with an empty volume, Docker automatically
      copies the image's home directory contents into it, so your shell configuration and
      tooling are fully intact from the first session.

      Individual bind mounts from other capabilities, such as ~/.zshrc.local or ~/.npmrc
      from mount-bind, are layered on top of the volume and continue to work normally. Use
      the standard profile variant (without mount-volume) when you want a clean, throwaway
      home directory on every rebuild or when running on Linux where the performance
      difference does not apply. Use a volume-based profile variant when build tool
      caches and home directory state need to survive rebuilds and you are on macOS or
      Windows where native I/O performance matters.
    installed: false
