  - name: docker-outside-of-docker
    summary: Docker-outside-of-Docker using host Docker socket
    description: |-
      Docker-outside-of-Docker (DooD) gives the devcontainer access to Docker by
      mounting the host's Docker socket (/var/run/docker.sock) into the container.
      The docker CLI inside the container communicates with the same daemon that is
      already running on your host, so there is no second daemon to start and no
      --privileged flag required. The ghcr.io/devcontainers/features/docker-outside-of-docker
      feature installs the Docker CLI and Buildx and bind-mounts the host socket at
      /var/run/docker-host.sock.

      The post-start script (docker-socket-init.py) installs a customization on top
      of the feature's /usr/local/share/docker-init.sh that forces it down its
      socat fallback path. The resulting /var/run/docker.sock is owned by user=node,
      so non-root socket access works via the OWNER permission bit rather than
      supplementary group membership. This sidesteps a race where PID 1's
      supplementary groups are frozen by setgroups() before the upstream
      groupmod fast-path runs, which otherwise leaves the socket inaccessible
      from every shell descended from PID 1 (i.e. all of them). The
      customization is idempotent (marker-guarded), and the upstream script is
      backed up to /usr/local/share/docker-init.sh.upstream on first run, so the
      workaround can be cleanly retired when upstream fixes the underlying issue.

      Because the inner docker CLI talks directly to the host daemon, all Docker
      state is shared: a docker ps inside the container shows the same running
      containers as on the host, and images pulled or built inside the container go
      straight into the host's image cache. This cache sharing means subsequent
      pulls are fast, and image layers built during one session are immediately
      reusable in the next. The absence of a second daemon also reduces memory and
      CPU overhead compared to docker-in-docker.

      The key trade-off is isolation: since the container and the host share the
      same Docker daemon, a docker rm or docker rmi inside the container affects
      host containers and images as well. This capability is the right choice when
      you want to build or run images, benefit from the host cache, and are
      comfortable operating against shared Docker state. For CI-style isolation
      where container builds must not affect the host, docker-in-docker is the
      safer option. Two profile variants are available: standard-docker-outside-of-docker
      for a single-container workspace, and standard-concurrent-docker-outside-of-docker
      for multi-container workspaces where port-conflict avoidance is needed.

      DOCKER_HOST is intentionally left unset by this capability. docker CLI's
      built-in default is /var/run/docker.sock, which is exactly the node-owned
      socat proxy created above -- so the default behavior is correct on every
      host, regardless of host docker GID. A login script (docker-host-fix.sh)
      also runs in every terminal session to defend against a Mac-specific issue
      where shell dotfiles such as ~/.zshrc.local leak a host-specific DOCKER_HOST
      value (for example, Rancher Desktop's unix://$HOME/.rd/docker.sock) into
      the container; the script probes candidate sockets in priority order --
      preferring /var/run/docker.sock (the node-owned socat proxy) over
      /var/run/docker-host.sock (the raw bind-mounted host socket) -- and
      exports DOCKER_HOST to the first one it finds.
    installed: false
