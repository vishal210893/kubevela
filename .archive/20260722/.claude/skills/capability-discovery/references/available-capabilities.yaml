  - name: git
    summary: Git workflow automation for commits, branches, and pull requests
    description: |-
      The git capability provides complete workflow automation covering the full development
      lifecycle from creating a branch to merging a pull request. Every stage of the
      process -- committing changes, pushing to remote, opening a PR, monitoring CI checks,
      and cleaning up after merge -- is handled through slash commands that integrate AI
      generation where it adds value and deterministic logic everywhere else.

      Branch names follow a configurable prefix/feature-name convention. Running /git:setup
      launches an interactive wizard that prompts for a branch prefix (typically your
      username, e.g. "jsmith") and whether to embed issue numbers in branch names
      (used by /issue). Once configured, /branch:create applies the prefix
      automatically, so typing "/branch:create add-retry-logic" produces a branch named
      "jsmith/add-retry-logic". The wizard stores all settings in ~/.dev/dev.yaml keyed
      by repository name, so different repos can have different conventions.

      All git operations use HTTPS rather than SSH. The GH_TOKEN environment variable
      provides authentication; every push and fetch is made through an authenticated
      URL of the form https://x-access-token:TOKEN@github.com/owner/repo.git. Your
      ~/.gitconfig is mounted into the container read-only as ~/.gitconfig-host, and a
      wrapper config at ~/.gitconfig includes it while overriding settings that do not
      work inside a container (such as host-specific credential helpers or SSL certificate
      paths). This keeps your host identity intact without requiring any container-side
      git configuration.

      The standard daily workflow: /branch:create (or /branch "description") to start a
      feature branch, /git:commit to stage everything and create a commit with an
      AI-generated conventional-format message, /git:sync to push and open a PR, and
      pipeline flags (--poll, --fix, --merge) to automate CI monitoring and merge.
      Use /git:sync --pr to create a PR from the current branch with optional polling,
      auto-fix, and merge. For a fully automated one-shot path, use /branch:create with
      --merge. Use /pr:pull to check out a colleague's PR branch for local review, and
      /branch:prune to
      delete all merged branches from both local and remote, with automatic cleanup of any
      associated dev.yaml metadata.

      The official commit-commands plugin (/commit, /commit-push-pr, /clean_gone)
      is also installed as a lightweight alternative for simple operations. Custom
      commands are self-contained and do not depend on the plugin.
