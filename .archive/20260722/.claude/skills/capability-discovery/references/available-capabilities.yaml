  - name: aidev.admin
    summary: Release automation, repo management, and CI/CD tools for ai-dev maintainers
    description: |-
      The admin capability is for maintainers of the AI Dev CLI who need release
      automation, repository management, and CI/CD tooling. It provides the full set of
      commands for publishing releases, managing dist-tags, triggering workflows, running
      housekeeping chores, and operating the CI/CD pipeline -- everything required to
      take a code change from commit to validated, published release.

      Releases are no longer driven by per-version git tags. Each PR push
      publishes a preview tarball and tags it with pr-N on npm; merging the PR
      flips that pr-N dist-tag to alpha. /release beta and /release latest
      promote the npm dist-tags directly via release.yaml; alpha tags are
      never minted by hand. /release supports an optional explicit version
      (auto-advance / rollback) and --rollback --reason for incident response.

      Releases use a three-channel promotion model: alpha for initial validation, beta
      for wider testing, and latest for general availability. Alpha tags are auto-created
      by merge.yaml's release-alpha-code job on every green push to main -- they are
      never minted by hand. A maintainer advances a release by bumping the version with
      /release:version, then running /release beta to promote the newest green alpha to
      beta, and /release latest to promote the newest beta to latest. /release beta
      creates a beta git tag at the alpha's commit and lets release.yaml publish; it
      auto-cleans orphan beta tags left behind by failed prior publishes. /release
      latest verifies release.yaml was green on the beta commit and dispatches
      promote.yaml to republish as latest and cut the v{version} tag. Adding --poll
      blocks until the triggered workflow completes and reports results.
      /release:rollback moves the latest dist-tag back to a known-good version, and
      /release:status gives a quick snapshot of local and published state.

      Housekeeping is handled through /chores, which runs all chores in sequence
      (generate release notes, dedup capabilities, sort capability lists, sort YAML
      properties, uplift versions, update authors, enforce model inheritance, prune
      orphaned capabilities, build, and validate docs), or by invoking any individual
      /chore:* command directly.

      The ci-script-architecture skill documents the patterns for sharing logic between
      /commands, GitHub Actions workflows, and Python scripts. It covers the three
      architecture patterns (shared scripts, CI dispatch, and Claude-dependent), PEP 723
      conventions, dual-output modes, and testing strategies.
