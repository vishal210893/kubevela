  - name: app-plat.session-anacron
    summary: Run periodic chores at session start when stale (anacron pattern) -- no cron daemon needed
    description: |-
      Anacron for Claude sessions: chores declare "run me when my last success
      is older than N days", and a SessionStart hook runs whatever is due,
      in the background, the next time any session starts. Session starts are
      near-daily in practice, so weekly/monthly chores fire on time without a
      cron daemon, without the container needing to be up at a wall-clock fire
      time, and without depending on CronCreate durability (which does not
      persist across restarts -- anthropics/claude-code#50911 -- and is
      project-cwd-scoped when it works, #66509).

      How it works:
      - Chores are KEY=VALUE files in `.claude/session-anacron/chores.d/`
        (COMMAND, INTERVAL_DAYS, optional RETRY_DAYS / TIMEOUT_SECONDS /
        REQUIRES / ENABLED / DESCRIPTION).
      - The SessionStart hook surfaces consume-once outcome reports from prior
        runs, then dispatches due chores in the background -- session start is
        never blocked on a chore.
      - State (stamps, locks, logs, reports) lives in
        `~/.claude/session-anacron/state/` -- bind-mounted, so it survives
        container rebuilds; a chore that ran yesterday does not re-fire after
        a rebuild.
      - Concurrent sessions are deduplicated with flock; a chore runs once per
        interval no matter how many sessions start.
      - Failures always surface a report at the next session start and back
        off (RETRY_DAYS, default 1 day) instead of retrying on every session.
      - Successes surface a report only when the chore wrote output, so a
        no-change sync stays silent.

      CLI: `session-anacron status` (table of chores + stamps),
      `session-anacron run-now <name>` (force a run), `session-anacron due`.

      Ships one chore: `podiq-sync` -- the weekly PodIQ roster sync for
      ispl-pl (draft PR on roster diff; silently skipped on machines without
      the ispl-pl checkout). Add your own chores by dropping `.chore` files
      into the chores.d directory.
