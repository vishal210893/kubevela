  - name: springboot-ha-checker
    summary: Spring Boot and Kubernetes HA analyzer
    description: |-
      High availability means a service keeps serving requests even when individual
      instances fail, nodes are drained, or a database primary fails over to a replica.
      Achieving that in Guidewire's cloud platform requires specific patterns in both your
      Java application code and your Kubernetes manifests — patterns that are easy to
      overlook during initial development and that become costly to retrofit later.

      The /gw:ha-check command runs a two-part static analysis against a Spring Boot
      microservice directory. The application-code analyzer walks every Java source file
      annotated with @Service, @Component, @Controller, or @RestController and checks
      whether methods that touch external systems are protected with retry logic
      (@Retryable, @Retry, @CircuitBreaker, @Bulkhead, @RateLimiter, @TimeLimiter, or
      @HystrixCommand), whether retry annotations include exponential backoff via @Backoff,
      whether the application class carries @EnableRetry, whether HikariCP connection pools
      declare a max-lifetime for clean failover, and whether the JVM DNS TTL is set low
      enough to follow a database primary after failover. The Kubernetes analyzer parses
      deployment manifests — including Kustomize overlays and Gradle-generated manifests
      from generateKubeTemplates — and verifies minimum replica counts, the presence of a
      HorizontalPodAutoscaler and PodDisruptionBudget, topology spread constraints across
      availability zones and nodes, pod anti-affinity rules, resource requests and limits
      on every container, and liveness and readiness probes.

      This is an advisory tool, not an enforcement gate. Findings are grouped into errors
      (patterns that will likely cause downtime), warnings (patterns that reduce resilience
      but may not cause immediate failure), and informational notes. Each finding includes
      a concrete recommendation with a code example so you know exactly what to add. Run
      it before submitting a service for platform review, when onboarding a legacy service
      to the cloud platform, or any time you want a quick readiness check.
