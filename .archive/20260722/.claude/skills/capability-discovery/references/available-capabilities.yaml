  - name: statusline
    summary: Context-rich statusline with model, profile, git, context and money usage, and directory info
    description: |-
      The statusline capability replaces Claude Code's default terminal prompt with an
      information-rich status line that gives you ambient awareness of your development
      context at a glance. It shows the active Claude model, the current profile and
      its version, container and Claude Code versions, context window usage, and your
      current git branch -- all without requiring you to run any commands.

      The default compact display is shaped like
      `S46h [admin2@27 · img101³ · cc195 · ctx35% · 16%/$1k · dev ➣ main] //dev2`.
      It uses middle-dot separators inside the bracket, compact profile/container/
      Claude Code version labels, and compact context and money usage tokens.

      The profile segment shows the active profile's name and, by default, its
      version from $WSROOT/.devcontainer/profile.yaml. Compact display renders this
      as `admin2@27`. Version compression drops major `1` and zero patches
      (`1.27.0` -> `@27`, `1.27.1` -> `@27.1`, `2.0.0` -> `@2.0`). Set
      display-format to full for the old
      profile-name plus full-version shape. The version display can still be hidden with
      show-profile-version (default true).

      The model segment shows the model name with optional suffixes: a "1M" tag when the
      active model is in 1M-context mode, and a 3-letter reasoning effort tag for models
      that support adjustable effort (LOW, MED, HI, XHI, MAX). For example, an Opus 4.7
      session with 1M context and xhigh effort renders as Opus 4.7 1M XHI. The default
      model-format is compact, which shrinks the family/version to a single letter plus a
      dotless version and collapses the effort to a compact suffix (l, m, h, + for xhigh,
      ++ for max) glued directly to the preceding token, e.g. O47 1M+ -- saves characters
      in contexts where horizontal space matters. Set model-format to full for the
      long-form rendering.

      display-format controls the broader statusline grammar. The default compact
      value renders profile versions as `admin2@27`, container image versions as
      `img101` plus the existing update marker, Claude Code versions as `cc195`,
      context as `ctx35%`, and bracket separators as ` · `. Set display-format to
      full for the old version labels and ` | ` separators. The older version-format
      key is accepted as a compatibility alias when display-format is unset.

      When you associate a spec with a branch using the spec capability, the statusline
      displays the spec name in mint green with an arrow to the branch. Both integrations
      update automatically as you switch branches.

      The statusline supports dark and light themes to match your terminal background. Dark
      theme uses bright mint, cyan, gold, and violet on a dark background; light theme uses
      saturated deep greens, teals, and reds that remain readable on white or pale
      backgrounds. Run /statusline:setup for an interactive wizard that walks you through
      theme selection and lets you toggle each individual segment on or off. Alternatively,
      use /statusline:config --set theme dark (or light) to change the theme directly, or
      /statusline:dark-mode and /statusline:light-mode for one-step switches.

      The usage segment shows money consumed, read from the Anthropic usage API and
      cached for a configurable TTL (default 120 seconds). It has up to two compact
      meters, each rendered as the percent consumed out of the cap
      (e.g., `16%/$1k`):

      - Credit: your smallest active pre-paid credit pool. Usage draws these credits
        down before any overage is charged, so this is usually the number actually
        moving. Shown first as `16%/$1k`; when exhausted, it renders cap-only in red
        (for example `$1k`).
      - Spend: usage-based-pricing -- money spent beyond your plan, from the `spend`
        object. Untouched spend is hidden while credit is active. Once overage moves,
        it is shown after credit with an internal middle dot, for example
        `$1k · 3%/$300`. Spend at 100% renders cap-only in red.

      Each part is omitted when its data is absent (no active credit pool, or spend
      disabled), and the whole segment falls back to stale cache or is silently omitted
      when credentials are missing or the API is unreachable. The credit pool keys in
      the API are opaque per-grant codenames, so pools are detected by shape (a
      positive dollar limit), not by name.

      In active meters the percent leads and the cap follows after `/`. The whole
      token escalates in color as you approach the limit, mirroring the context
      segment:

      - Below the warning threshold (default 50%): token shown dim (e.g., `16%/$1k`).
      - At or above the warning threshold (default 50%): percent shown in gold
        (e.g., `57%/$300`).
      - Above the critical threshold (default 80%): percent shown in red
        (e.g., `83%/$300`).

      Configure with usage-threshold-warning (default 50) and usage-threshold-critical
      (default 80). Unicode symbols are used on macOS; ASCII fallbacks are used on Windows
      to avoid cp1252 encoding crashes.

      Under the hood, Claude Code invokes a Python script (statusline.py) on every statusline
      refresh via the statusLine.command setting. The script reads the current model and
      context data from standard input, queries git for branch and change status, and reads
      profile and configuration data from dev.yaml to produce a fully formatted, color-coded
      output string.

      Because Claude Code cancels a statusline render that is still running when the next
      refresh fires, the render is kept fast and constant-time: it only reads local files,
      caches, and git, and never blocks on the network. The slow, external segments -- API
      usage, the container-version check, and the Claude Code version -- are refreshed by a
      detached background process and served from cache, so they may lag by a render or two
      while the rest of the line stays current. The resolved Python interpreter is cached so
      later renders skip uv's startup cost.
