  - name: odin
    summary: Odin API definition and OpenAPI generation
    description: |-
      Odin is a declarative OpenAPI generator that turns concise YAML resource
      definitions into complete OpenAPI 3.0 specifications and PostgreSQL schemas.
      Instead of hand-writing hundreds of lines of OpenAPI YAML for every endpoint,
      you define resources in a compact format -- a single empty resource block like
      `tenant: {}` is enough to generate full CRUD paths, request and response
      schemas, and standard documentation. Odin handles five resource types (normal,
      versioned, singleton, properties, and action), supports hierarchical namespaces
      for nested resources, and uses a three-level configuration inheritance model
      so organization-wide defaults flow down to projects and individual APIs.

      This capability adds three commands and a comprehensive development skill.
      /odin:create-api scaffolds a new API definition file with the correct
      structure and metadata already in place. /odin:add-resource appends a typed
      resource to an existing definition. /odin:generate runs the Odin processor
      to produce a full OpenAPI specification, with options for validation-only
      mode, Swagger UI preview, and PostgreSQL schema generation. The
      odin-development skill provides detailed reference for all resource types,
      path and operation configuration, custom actions, payload definitions, and
      best practices for building maintainable API definitions.
