  - name: zsh-keybindings
    summary: Opt-in zsh key bindings (Ctrl+Arrow, prefix history, Alt+Backspace, Home/End)
    description: |-
      Adds common interactive shell key bindings missing from the bare zsh setup. Pure bindkey
      configuration -- no package installs, no edits to ~/.zshrc.

      Bindings:
        - Ctrl+Left / Ctrl+Right: word navigation (backward-word / forward-word)
        - Up / Down: prefix-based history search (e.g. type "git " then Up to surface
                     only previous commands starting with "git ")
        - Alt+Backspace: delete previous word (backward-kill-word)
        - Home / End: jump to line start / end across xterm, iTerm2, VS Code,
                      Ghostty, kitty, alacritty, rxvt, tmux/screen, etc.

      Each binding covers both cursor-mode and zle app-keypad (smkx) escape sequences plus the
      terminfo-resolved sequence as a self-adapting fallback, so behavior is consistent across
      every terminal emulator we ship into.

      Opt-in: This capability is intentionally NOT included in any base or standard profile.
      Keybindings are a personal-preference decision -- some developers run zsh in vi-mode,
      some have years of muscle memory around plain history walking, some have their own
      bindkey lines in their dotfiles. To use these defaults, add `zsh-keybindings` to your
      profile's `capabilities` list explicitly.

      Safety:
        - Guarded to be a no-op outside interactive zsh (dev cc / dev run paths
          are unaffected).
        - User customizations in ~/.zshrc.local are sourced after this script and take
          precedence -- add `bindkey` lines there to override.
        - Bare ^H is deliberately NOT rebound (it is plain Backspace on PuTTY default,
          TERM=linux console, and stty erase=^H sessions).
    installed: false
