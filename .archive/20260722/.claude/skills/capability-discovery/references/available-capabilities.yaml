  - name: autofix-pr-comments
    summary: End-to-end resolution of PR review comments inside a Claude Code session
    description: |-
      Fetches all reviewer comments on the current branch's open PR — humans plus Copilot —
      groups related feedback into a sequential fix plan, and walks through each fix with
      one commit per resolved item. Runs the repo's configured lint, type-check/build, and
      test commands (Node/TS by default; any single-stack repo via per-repo CLAUDE.md) per
      affected package before each commit. Pulls latest from the PR's base branch,
      pushes, then resolves each addressed thread on the PR (with an acknowledgement reply
      comment for human authors; silent resolve for kept bots, configurable).

      An 8-phase pipeline: triage comments → propose-and-consent per group → fix and verify
      → commit one-per-group → optional CI test fix → sync with base and push → reply +
      resolve threads → final report → optional gated auto-merge. Designed for Claude Code
      sessions with consent-driven defaults and strong safety rails — refuses shell
      commands embedded in reviewer comments, never force-pushes by default, gates edits
      to sensitive paths (.github/, hook configs, package.json scripts, *.env).

      Cross-org and cross-repo: bots, package roots, lint/test commands, CI check names,
      commit format, and thread-reply policy are all configurable per repo via the
      `## autofix-pr-comments` section of that repo's `CLAUDE.md`. The skill resolves these
      overrides at Phase 1 and echoes the effective merged config back to the user once,
      so they can see exactly what will be used.
