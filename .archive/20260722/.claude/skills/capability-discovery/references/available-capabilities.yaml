  - name: screenshots
    summary: Automatic macOS screenshot sync
    description: |-
      Working in a devcontainer creates a gap between what you see on your Mac and what Claude
      can access. Normally, sharing a screenshot with Claude means manually copying the file
      into the container, figuring out the path, and then referencing it. The screenshots
      capability eliminates that friction entirely: take a screenshot and it appears inside
      the container within seconds, ready to reference in any prompt.

      The setup works by configuring macOS to save all screenshots to ~/.screenshots on your
      host (done automatically by the host setup script that runs during dev profile install).
      That directory is mounted into the container at /workspaces/.screenshots. A background
      daemon starts with the container and watches that mount for new files; whenever a new
      screenshot arrives, the daemon copies it to ~/img.png in your home directory. The five
      most recent screenshots are kept as a rolling window at ~/img.png through ~/img5.png, so
      earlier captures are still accessible even after you take new ones.

      To share a screenshot with Claude, tell it to read the image in the
      /home/node/img.png file and inject what you read into the context, or run
      /screenshot to have Claude load it automatically in one step. Use
      /screenshot:list to see all recent captures with their timestamps when you
      need to reference something older than the most recent shot.

      For frequent use, iTerm2 users can configure a keyboard shortcut that inserts
      a screenshot reference prompt with a single keystroke: open iTerm2
      Preferences, go to Profiles -> Keys -> Key Mappings, and add a mapping for
      Ctrl+v with the action "Send Text" and the value "Read the image in the
      /home/node/img.png file and inject what you read into the context." Note that
      this capability is macOS-only; the host setup script and mount both depend on
      the macOS filesystem layout and screenshot system.
