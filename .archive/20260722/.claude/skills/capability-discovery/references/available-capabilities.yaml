  - name: base
    summary: Core devcontainer config, Claude Code permissions, and installation infrastructure
    description: |-
      The base capability is the foundation of every profile, providing core infrastructure
      that all other capabilities build upon.

      Environment: Sets WSROOT (workspace path) and SHELL (zsh). Forwards CCA_CLIENT_ID and
      CCA_CLIENT_SECRET from host for authentication.

      Lifecycle Dispatchers: Orchestrates scripts at three points - initialize-command
      (host, before container), post-create-command (container, after creation), and
      post-start-command (container, each start). Scripts use priority prefixes for ordering.

      Claude Code Permissions: Configures bypassPermissions mode for containers. Allows git,
      npm, build tools, and file operations. Prompts for rm and docker run/exec. Blocks
      destructive commands like git clean, sudo, and system-level operations.

      MCP Servers: Pre-configured GitHub (requires GH_TOKEN), Confluence, and Jira servers.
      Enable via /mcp in Claude Code.

      Installation Infrastructure: The install.py dispatcher runs numbered scripts during
      "dev profile install", executing capability-contributed setup in priority order.

      VS Code: Configures zsh as default terminal and includes Remote Containers and JSON
      language extensions.

      Skills: Includes skill-creation guide for building custom Claude Code skills.
