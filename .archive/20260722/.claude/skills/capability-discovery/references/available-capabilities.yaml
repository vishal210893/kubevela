      automatically with no manual reinstallation. The install runs in the
      background so it does not hit the post-create dispatcher's 10-second
      foreground timeout; failures surface in the per-script background log rather
      than the post-create summary banner.

      herdr keeps its layout/session state in ~/.config/herdr/session.json, which
      otherwise lives in the container's ephemeral writable layer and is lost on
      rebuild. This capability bind-mounts ~/.config/herdr from the host so herdr
      restores its workspaces, tabs, panes, and cwd across container rebuilds.
      (Running processes still do not survive a rebuild -- only the saved layout.)

      herdr's Unix sockets must NOT live on that bind mount: on Docker Desktop for
      macOS the mount is virtiofs, and the herdr server cannot bring up its client
      protocol socket there, so it never becomes ready (the client fails with
      "server did not become ready within 5s"). HERDR_SOCKET_PATH and
      HERDR_CLIENT_SOCKET_PATH therefore relocate the sockets to ~/.cache/herdr on
      the container-local overlayfs. The sockets are runtime-only and need no
      persistence; herdr creates the directory on launch.

      Requires ~/.local/bin to be on PATH, which the standard profile chain
      already provides.
