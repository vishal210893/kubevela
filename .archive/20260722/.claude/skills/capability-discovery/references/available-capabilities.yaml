  - name: sdet.pcf-graph
    summary: >-
      PCF navigation graph - screen map, test selection, path finding for any Guidewire
      InsuranceSuite app
    description: |-
      Static-analysis toolkit that extracts the UI navigation graph from Guidewire
      InsuranceSuite PCF (Page Configuration File) XML sources and exposes it through
      an interactive visualisation and a set of testing-intelligence CLIs. Works with
      ClaimCenter (app-cc), BillingCenter (app-bc), PolicyCenter (app-pc), and
      ContactManager (app-cm).

      The toolkit answers four questions that matter for SDET work:

      1. **What connects to what?**  An interactive HTML graph (openable via file://)
         shows every screen, cluster, and navigation edge - with UI component type,
         label, and PCF element ID on each link.

      2. **Which tests should I run?**  `pcf-graph impact --git-diff` traverses the
         navigation graph upstream and downstream of every changed PCF file and maps
         affected functional areas to CC test suites (CCV3ServerFinancials, CCV3SmokeFNOL,
         etc.).

      3. **What is the highest-risk screen?**  `pcf-graph rank` computes betweenness
         centrality to identify the hub screens that, if broken, affect the most paths.
         Use the output to build or maintain a permanent smoke suite.

      4. **How do I get from A to B?**  `pcf-graph path --from FNOLWizard --to
         ReserveSummaryDV` returns every navigation path with the triggering UI element
         (button, menu item, cell click) at each hop, annotated with the PCF element ID
         that maps to the `data-gw-id` DOM attribute for Playwright selectors.

      Setup

      The `pcf_graph` Python package is bundled with this capability (under the
      skill, at `skills/pcf-graph/tools/pcf-graph/`) and installs alongside the
      wrappers into `.claude/`, so it is always present -- no separate checkout or
      install step. The wrapper scripts run it from source under a uv-provisioned
      interpreter, so `networkx`/`pyyaml` are fetched automatically on first run.
      Discovery resolves the bundled copy relative to the wrappers; to point at a
      different source tree, set `PCF_GRAPH_ROOT`. Run `/sdet:pcf-graph` for an
      interactive walkthrough of the available commands.

      Extraction is schema-driven: it builds a navigation graph plus per-screen
      elements (with stable selectors), workflows, and typelist allowed-values.
      `--app-name` selects the app (ClaimCenter, BillingCenter, PolicyCenter,
      ContactManager); `--visualize`, `--split`, and `--raw` control output form.
