    description: |-
      On macOS and Windows, Docker Desktop runs containers inside a Linux virtual
      machine. File operations that cross the VM boundary via the default bind mount
      are dramatically slower than native Linux I/O. This affects every read, write,
      and stat call against your source code checkout, making builds, tests, and IDE
      indexing noticeably sluggish.

      mount-volume-src creates a named Docker volume mounted at /home/node/src,
      giving you a dedicated location for source code that stays entirely inside
      the Linux VM. All filesystem operations against ~/src use native Linux I/O,
      delivering the same performance boost as mount-volume but without replacing
      the entire home directory. Because /home/node itself remains the image default,
      you continue to receive base image updates to shell configuration, tooling,
      and dotfiles on every container rebuild.

