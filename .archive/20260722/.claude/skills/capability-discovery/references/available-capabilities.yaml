  - name: oh-my-zsh
    summary: Mount host ~/.oh-my-zsh so themes, plugins, and custom config travel into the container
    description: |-
      Reuses your host oh-my-zsh install inside the container by bind-mounting ~/.oh-my-zsh.
      Theme, plugins, and the `source $ZSH/oh-my-zsh.sh` call live in your host ~/.zshrc.local
      (already mounted by the mount-bind capability), so the container never prescribes a
      theme. Custom themes and plugins under $ZSH/custom/ travel in via the same mount.

      This capability is intentionally infrastructure-only. It does not source oh-my-zsh,
      set ZSH_THEME, or pick plugins -- you keep full control via your ~/.zshrc.local. The
      mount is live in both directions; auto-update is best disabled in your init snippet
      (DISABLE_AUTO_UPDATE=true) so the container does not mutate your host install.

      Requires: oh-my-zsh installed on your host at ~/.oh-my-zsh (the standard installer
      at https://ohmyz.sh puts it there). If the directory is missing, ensure-exists creates
      an empty one and the mount succeeds, but `source $ZSH/oh-my-zsh.sh` from your
      ~/.zshrc.local will fail until you actually install OMZ on the host.
