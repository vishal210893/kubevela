  - name: lsp-disable
    summary: Override ENABLE_LSP_TOOL=0 -- disables Claude Code's LSP tool
    description: |-
      The `lang-java` and `lang-typescript` capabilities set
      `ENABLE_LSP_TOOL=1`, which activates Claude Code's built-in LSP tool
      and, for Java workspaces, launches Eclipse JDT Language Server (jdtls
      1.57.0 as of 2026-05). This capability sets `ENABLE_LSP_TOOL=0` so
      that LSP startup is suppressed.

      Why this matters for InsuranceSuite teams (concrete pain, not
      speculation): jdtls ships with the Eclipse Buildship Gradle
      integration bundle in its `plugins/` directory. When jdtls is asked
      to open a Gradle workspace, Buildship runs a full Eclipse
      workspace-import against it and writes `.project`, `.classpath`,
      `.settings/`, and `bin/` artifacts under every module it touches.
      On a large multi-module InsuranceSuite repo (PolicyCenter etc.,
      200+ modules) this produces tens of thousands of untracked files.
      A teammate hit 59,549 unstaged Eclipse artifacts after this triggered
      on their workspace.

      Diagnosis trail (so the next person reading this can rebuild it):
      Peter Williams + Glean confirmed Buildship is bundled in
      `~/.local/share/jdtls/plugins/`. Stephen Zhou and Alex Korostov
      traced the activation to ai-dev's `lang-java` capability setting
      `ENABLE_LSP_TOOL=1`, which was introduced in ai-dev PR #1104
      (Shane Claussen, 2026-04-01, "feat(lang): merge lsp-* capabilities
      into lang-* capabilities").

      This capability does NOT uninstall jdtls -- the Java LSP server
      remains on disk via `lang-java`'s post-start install script. It
      only prevents Claude Code from launching it.

      Two reasons IS-platform teams want LSP off (acute and chronic):

      - Acute: the Buildship file generation described above, which is
        the visible-today symptom.
      - Chronic: jdtls is strictly less capable than ccbridge for this
        codebase. jdtls speaks Java; it does not understand Gosu, PCF,
        typelists, or IntelliJ's project model. ccbridge is a thin shim
        over the headless IS Studio instance and has all of that. When
        both are present, Claude's tool-selection is non-deterministic
        and a fraction of code-intel queries route to the weaker surface,
        producing inferior or Gosu-blind answers. Removing LSP collapses
        the surface area to a single canonical tool.

      Teams whose primary editor is IS Studio (or another full IDE) and
      who have ccbridge in their profile should adopt this capability.
      Teams that use Claude Code as the primary editor for Java without
      IS Studio / ccbridge should NOT add this capability.

      How the override wins mechanically: profile build iterates the
      profile's `capabilities:` list in `profile.yaml` **in list order**
      (it is NOT re-sorted alphabetically at build time -- see
      `src/commands/profile.js`'s devcontainer-merge loop, which iterates
      `profileYaml.capabilities` directly and `deepMerge`s each
      capability's `containerEnv` into a running dict, last-write wins on
      key collisions).

      The override is therefore robust **by convention, not by code**: the
      ai-dev repo's `/chore:sort-capability-lists` chore keeps every
      profile's `capabilities:` list alphabetically sorted, and
      `lsp-disable` sorts after `lang-java`/`lang-typescript` (`lsp-` >
      `lang-` lexically). As long as that convention is preserved on the
      consuming profile, `ENABLE_LSP_TOOL=0` from this capability
      overwrites the `=1` set by the lang-* capabilities.

      Brittleness to be aware of: if someone manually reorders a profile's
      `capabilities:` list and puts `lsp-disable` before either `lang-`
      capability, the override silently stops working (no CI check
      enforces sortedness as of this writing). A future improvement is
      either a build-time assertion or moving the override into the
      profile's `src/devcontainer/devcontainer.json` (which is merged
      AFTER all capabilities, regardless of order). For now, run
      `/chore:sort-capability-lists` on any profile that adopts this
      capability.

      Verification after adopting this capability and rebuilding the
      container: run these three checks inside the container to confirm
      the fix is live.
        1. `cat /proc/1/environ | tr '\0' '\n' | grep ENABLE_LSP_TOOL`
           should print `ENABLE_LSP_TOOL=0`.
        2. `pgrep -fa jdtls` should return nothing across normal
           Claude Code use.
        3. `git status --porcelain | grep -E '\.(classpath|project)$|\.settings/' | head`
           should stay empty over a week of normal use.
    installed: false
