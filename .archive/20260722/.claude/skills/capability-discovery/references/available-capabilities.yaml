  - name: trail
    summary: Record-and-replay UI testing for any team
    description: |-
      trail is a record-and-replay UI test runner intentionally designed so any
      Guidewire team can adopt it in minutes. Engineers and product managers
      record real flows in a browser; CI (TeamCity) replays them deterministically
      against the dev environment.

      Zero LLM dependency at runtime. The LLM is only involved during the
      optional "enrich" step that converts a raw recording into a readable
      YAML -- and that happens inside the engineer's Claude Code session, not
      in any subprocess or CI runner.

      INSTALL MODEL

      trail runs in TWO places:

      - **Container** (engineer-side): recording-to-YAML enrichment,
        headless replay, CI runs. Installed by /trail:init via gh.
      - **Host / Mac terminal**: recording and headed replays (anything
        that needs a visible Chromium window). Installed via a single
        `npm install -g` against the tarball that /trail:init caches
        under $WSROOT/.trail/cache/ -- no gh or git auth on the host.

      /trail:init is the canonical onboarding moment: it does the
      container install AND prints the exact host install command. The
      other slash commands keep redirect messages short and link back to
      /trail:init for the explanation. Recording runs on the host via
      `trail capture`; `/trail:enrich` handles conversion to YAML in
      the container (and points to the host CLI); /trail:replay and
      /trail:run default to headless in the container and reject --headed
      there.

      WORKFLOW

      1. Record: from a host terminal, `trail capture --url <url> --goal "..."`.
         Chromium opens, you click through, the recording lands at
         .trail/runs/<ts>/recording.json inside the workspace -- visible
         from both host and container.

      2. Enrich (optional): in Claude Code, read the recording and write a
         parameterized *.trail.yaml + multi-strategy page-object cache.
         The LLM lives in the chat session, never at runtime.

      3. Replay / CI: `trail run <yaml> [--ci]` drives Playwright
         deterministically. Headless in container or CI; headed on host
         for debugging. Self-heal events fail CI hard so UI drift is
         escalated, never silently patched.

      KEY FEATURES
      - Multi-strategy selectors (testid, id, aria-label, role+name, label, text,
        name-attr, css) -- tests survive non-trivial UI changes.
      - Semantic self-heal using Playwright role/label/text locators. No LLM.
      - JUnit XML output for native CI integration.
      - Multi-browser (chromium default, firefox, webkit).
      - SSO-ready (--auth-cookie, --storage-state).
      - Secret-safe: ${env.NAME} substitution; sensitive fills redacted in logs.

      DISTINCT FROM
      - mcp-playwright (gives Claude an MCP to drive a browser interactively):
        use that for one-off exploration; use trail for committable regression
        tests with no LLM at runtime.
      - jacoco-coverage (Java unit-test coverage): complementary -- jacoco for
        backend coverage, trail for UI flows.
