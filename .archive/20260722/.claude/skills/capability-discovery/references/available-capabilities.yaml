  - name: kubectl
    summary: Kubernetes CLI with kubeconfig passthrough
    description: |-
      Kubernetes is Guidewire's container orchestration platform. The kubectl capability
      makes your host's kubeconfig available inside the devcontainer, giving you access
      to the kubectl CLI and all configured clusters. You can run kubectl commands, inspect
      cluster state, manage deployments, and debug pods from within your devcontainer.

      The host's ~/.kube directory is mounted read-only at ~/.kube-host. A post-start
      script copies ~/.kube-host/config to ~/.kube/config on each container start,
      rewriting any cluster server addresses that use https://127.0.0.1 or
      https://0.0.0.0 to use https://host.docker.internal instead. This makes local
      clusters (kind, k3d, minikube) reachable from inside the devcontainer, where
      those addresses refer to the container's own interfaces rather than the host's.
      For rewritten cluster entries, certificate-authority-data is removed and
      insecure-skip-tls-verify is set, since the TLS certificate was issued for the
      local address and will not validate against host.docker.internal.
      Remote clusters (EKS, GKE, etc.) pass through unchanged.

      The KUBECONFIG environment variable is also forwarded from the host, so custom
      kubeconfig paths work automatically alongside the default location. Common workflows
      include deploying to a development cluster, checking pod logs during debugging, managing
      Helm releases, and inspecting resource status across namespaces. Whatever context is
      active on your host is immediately available inside the container.

      The only host-side prerequisite is a valid kubeconfig. Generate one from your
      cluster provider before starting the container - for example, with
      `aws eks update-kubeconfig` for EKS, `gcloud container clusters get-credentials`
      for GKE, or the equivalent command for your provider.
