  - name: ccbridge-index-cache
    summary: Mount Docker volume at ~/.cache/ccbridge for ccbridge's per-project IntelliJ indexes
    description: |-
      The ccbridge-index-cache capability mounts a named Docker volume at
      /home/node/.cache/ccbridge so ccbridge's per-project IntelliJ indexes
      persist across container rebuilds. ccbridge stores indexes at
      ~/.cache/ccbridge/<project-hash>/system/; on a 150-module project
      (ispl-pl), rebuilding indexes from scratch takes 6-10 minutes per
      project per container rebuild. Persisting them to a volume turns that
      into a sub-minute warm restart.

      This is a separate capability from intellij-cache because indexes are
      ccbridge-specific (the ~/.cache/ccbridge/ namespace is chosen by
      ccbridge), whereas the intellij-cache volume holds the JetBrains
      binary itself which any plugin host could share. Splitting per concern
      lets profile authors opt into binary persistence without paying for
      index persistence (smaller volumes for tight-disk hosts), or vice
      versa.

      A Docker volume is used rather than a bind mount to ~/.cache/ccbridge
      on the host because IntelliJ indexes embed absolute paths and project
      hashes derived from the container's filesystem layout; a host-side
      cache would be invalid inside the container.

      The mount is declared with volume-nocopy: true. Combined with
      mount-bind's ensure-mounts initialize script, this ensures the volume
      starts empty and is chowned to the container user (uid 1000) before
      the container starts, so ccbridge can write to the cache on first use
      without permission errors. mount-bind is declared as a prereq so this
      capability cannot be installed in a profile that lacks the
      ownership-init machinery.

      To customize the volume name, set DEVCONTAINER_CCBRIDGE_INDEX_VOLUME
      on your host before installing a profile that includes this
      capability. The default volume name is devcontainer-ccbridge-index,
      matching the devcontainer-* prefix convention used by sibling
      volume-mount capabilities (devcontainer-gradle, devcontainer-intellij).
