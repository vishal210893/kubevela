  - name: app-plat.ide-headless-limits
    summary: >-
      Kernel limits + JetBrains Gateway / reserved ccbridge port forwards for heavy in-container IDE
      use
    description: |-
      Raises per-user kernel limits for heavy in-container IDE use (headless
      IntelliJ via ccbridge, concurrent Gradle/Kotlin/JPS daemons).

      Docker's --sysctl flag only allows namespaced kernel/net/fs.mqueue
      sysctls by default. fs.inotify and vm.max_map_count are NOT in the
      allowlist, so these must be set at the VM level instead.

      For Rancher Desktop, add to provisioning scripts or run once:
        rdctl shell sudo sysctl -w fs.inotify.max_user_instances=1024
        rdctl shell sudo sysctl -w vm.max_map_count=524288

      The initialize-scripts hook checks the current sysctl values and
      prints advisory warnings on container provision if they are below
      the recommended thresholds -- so the fix is surfaced when it matters
      most (first rebuild after a Rancher Desktop update resets the VM).

      Also forwards two ranges from container to host:

      1. 5990-5999 (10 ports) -- JetBrains Gateway remote-dev backend default
         plus 9 auto-increment slots. Forwarded for the case where someone runs
         `bin/remote-dev-server.sh run` directly (not via ccbridge) and wants
         the default-port join link to work end-to-end. ccbridge's own flow
         does NOT use these ports from the host side -- it uses the 13000 range
         below. Kept as a non-ccbridge fallback per the dev-only nature of the
         setup.

      2. 13000-13019 (20 ports) -- ccbridge host-reachable port shim. The
         JetBrains backend port can't be pinned (the listener code is in
         closed-source CWM bytecode with no documented property/env/flag
         override) AND it binds only to 127.0.0.1 inside the container, so
         Docker port forwarding from Mac can't reach it directly. ccbridge
         v0.9.5+ runs `socat` as a TCP byte relay from 0.0.0.0:<P> to
         127.0.0.1:<actual>, where P is the first free port socat can bind
         in the 13000-13019 range. socat is transparent to TLS so the
         backend's cert and fingerprint check still pass end-to-end.

         20 ports supports up to 20 concurrent remote-dev backends per
         container, which is generous for the worktree-per-app pattern
         (multiple ISPL changes in flight, each with PC/BC/CC/AB worktrees =
         ~16 backends; 4 changes hits the ceiling).

         Range chosen via ai-dev port-usage survey -- clear vs all known
         ai-dev defaults and standard dev-tool collisions.

      Concurrency note: a second devcontainer on the same host that includes
      this capability will fail to start with "port already allocated"
      because Docker `-p` reserves the host ports unconditionally. Two
      ccbridge-using containers concurrently would need different
      CCBRIDGE_REMOTE_DEV_PORT_BASE values (and matching forwards). For the
      single-container case (which is the supported pattern), 20 ports
      inside that one container is the relevant ceiling.
