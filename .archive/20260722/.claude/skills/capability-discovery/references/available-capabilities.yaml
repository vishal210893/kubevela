  - name: app-plat.ispl-statusline-colors
    summary: ISPL-tuned context coloring and bracket stripping for the statusline
    description: |-
      Replaces the statusline context segment with logic tuned for the IS
      Platform team.

      Context percentage -- 5-bucket palette (applied uniformly to all
      models):

      - 0-40%  mint    (plenty of headroom)
      - 41-60% yellow  (heads up)
      - 61-70% orange  (winding down)
      - 71-80% red     (wrap up current task)
      - 81+%   violet  (auto-compact imminent)

      Upstream ships a 3-bucket palette driven by context-threshold-warning
      / context-threshold-critical. The 1M-specific defaults (15% / 40%)
      added in ai-dev PR #1205 color too pessimistically for this team --
      even at 40% of 1M there are ~600K tokens of headroom. The team view
      is that percentage-of-window is the right axis and a larger window
      should widen headroom, not shrink it.

      Implemented as a thin wrapper script (statusline-ispl.py) that
      imports the upstream statusline module, monkey-patches its
      format_context function, strips the upstream info-bracket separators,
      and delegates the rest to upstream. Profile, container image, Claude Code
      version labels, and Anthropic money-usage rendering are not customized; the
      upstream compact/full display behavior is inherited unchanged.

      The capability overrides statusLine.command in settings.json to
      point at the wrapper.

      Sub-repo coverage -- a post-create + post-start script
      (mirror-statusline-to-user.py) copies the statusLine block into
      ~/.claude/settings.json so the coloring also applies when Claude
      Code is launched from a sub-repo (e.g., ai-dev, ispl-pl) that has
      its own .git directory and is treated as its own project root.
      Without this mirror, project-level settings.json is invisible from
      those sub-repos. The wrapper command itself uses $WSROOT (set
